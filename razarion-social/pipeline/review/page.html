<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Razarion Social</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #dde1e6; --text: #1d2126; --muted: #69717c;
    --accent: #2f6fd6; --ok: #1f8a4c; --ok-bg: #e3f4ea; --warn: #a86400; --warn-bg: #fdf1dc;
    --skip: #7b8290; --skip-bg: #eceef1; --bad: #c0392b; --bad-bg: #fbe5e2; --posted: #5b4bb7; --posted-bg: #ebe8fa;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --panel: #1f2328; --line: #343a42; --text: #e4e7eb; --muted: #9aa3ad;
      --accent: #6aa0ff; --ok: #5fd08e; --ok-bg: #1b3326; --warn: #f0b45a; --warn-bg: #3a2c14;
      --skip: #9aa3ad; --skip-bg: #2a2f36; --bad: #ff7b6b; --bad-bg: #3d1f1b; --posted: #a99bff; --posted-bg: #2a2548;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 16px; margin: 0; }
  header.top .summary { color: var(--muted); }
  header.top .spacer { flex: 1; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); border-color: var(--ok); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: #fff; }

  article.post { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  article.post > .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .head .date { font-weight: 600; }
  .head .id { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--skip-bg); color: var(--muted); }
  .chip.tone { background: var(--warn-bg); color: var(--warn); }
  .body { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
  .media { padding: 16px; border-right: 1px solid var(--line); display: grid; gap: 10px; align-content: start; min-width: 0; }
  .media .frame { background: #000; border-radius: 6px; overflow: hidden; display: grid; place-items: center; min-height: 160px; }
  .media video, .media img { display: block; max-width: 100%; max-height: 480px; }
  .media .frame.empty { background: var(--bg); border: 1px dashed var(--line); }
  .media .none { color: var(--muted); padding: 24px; text-align: center; }
  .media .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .media .files button { font-size: 12px; padding: 2px 8px; }
  .media .files button.on { border-color: var(--accent); color: var(--accent); }
  .reference { font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .reference b { color: var(--text); font-weight: 600; }
  .nets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  section.net { min-width: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
  section.net .title { display: flex; gap: 8px; align-items: center; }
  section.net .title strong { font-size: 14px; }
  .state { font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .state.review { background: var(--warn-bg); color: var(--warn); }
  .state.ok { background: var(--ok-bg); color: var(--ok); }
  .state.skip { background: var(--skip-bg); color: var(--skip); }
  .state.posted { background: var(--posted-bg); color: var(--posted); }
  label.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  label.field .count { justify-self: end; font-variant-numeric: tabular-nums; }
  label.field .count.over { color: var(--bad); font-weight: 600; }
  label.field .count.soft { color: var(--warn); }
  textarea, input.text { width: 100%; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; resize: vertical; }
  textarea:focus, input.text:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea[readonly], input.text[readonly] { opacity: .75; }
  .flags { display: flex; flex-wrap: wrap; gap: 4px; }
  .flag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--bad-bg); color: var(--bad); }
  .flag.note { background: var(--skip-bg); color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .actions .hint { color: var(--muted); font-size: 12px; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta a { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: min(680px, 90vw);
    padding: 10px 16px; border-radius: 8px; background: var(--bad); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none; z-index: 10; }
  #toast.info { background: var(--ok); }
  /* The engine's dashboard - only there when engine.mjs serves the page. */
  #engine { display: none; gap: 16px; }
  #engine.on { display: grid; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
  .panel h2 { font-size: 14px; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel h2 .spacer { flex: 1; }
  .status-row { display: flex; gap: 28px; flex-wrap: wrap; align-items: baseline; }
  .big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .label { font-size: 12px; color: var(--muted); }
  .nets-health { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .health { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .health.auth { border-color: var(--bad); background: var(--bad-bg); }
  .health.error { border-color: var(--warn); }
  .health .msg { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .health a.button { display: inline-block; text-decoration: none; background: var(--bad); color: #fff; border-radius: 6px; padding: 5px 12px; font-weight: 600; justify-self: start; }
  .health input { width: 100%; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--skip); }
  .dot.ok { background: var(--ok); } .dot.auth { background: var(--bad); } .dot.error { background: var(--warn); }
  table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.q td, table.q th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.q th { font-size: 12px; color: var(--muted); font-weight: 600; }
  table.q td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.q td.text { overflow-wrap: anywhere; }
  table.q a, .runs a { color: var(--accent); }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 20px; }
  .settings fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; align-content: start; }
  .settings legend { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0; margin-bottom: 4px; }
  .settings label { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .settings input[type=number] { width: 60px; }
  .settings input[type=text], .settings input[type=number], .health input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .days label { border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .runs { display: grid; gap: 4px; font-size: 13px; max-height: 360px; overflow: auto; }
  .runs .run { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .runs .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .out-published { color: var(--ok); } .out-failed, .out-login { color: var(--bad); } .out-nothing { color: var(--muted); }
  details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  @media (max-width: 800px) {
    .nets-health { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .runs .run { grid-template-columns: 1fr; }
    main { padding: 12px 0; }
    article.post { border-radius: 0; border-left: 0; border-right: 0; }
    .body { grid-template-columns: 1fr; }
    .media { border-right: 0; border-bottom: 1px solid var(--line); }
    .nets { grid-template-columns: 1fr; }
    section.net { border-right: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Razarion Social</h1>
  <span class="summary" id="summary"></span>
  <span class="spacer"></span>
  <div class="seg" id="filter">
    <button data-all="0" class="on">Open</button>
    <button data-all="1">All</button>
  </div>
  <button id="reload">Reload</button>
</header>
<main>
  <section id="engine">
    <div class="panel">
      <h2>Engine <span class="chip" id="eng-job"></span><span class="spacer"></span>
        <button id="eng-pause"></button><button id="eng-produce">Make a post now</button></h2>
      <div class="status-row">
        <div><div class="label">Next post</div><div class="big" id="eng-countdown">–</div><div class="label" id="eng-next"></div></div>
        <div><div class="label">Posts a week, per network</div><div class="big" id="eng-perweek"></div></div>
        <div><div class="label">Buffer (ready to go)</div><div class="big" id="eng-buffer"></div><div class="label" id="eng-buffer-detail"></div></div>
        <div><div class="label">Approval</div><div class="big" id="eng-approval"></div></div>
      </div>
      <div class="nets-health" id="eng-health"></div>
    </div>
    <div class="panel"><h2>Queue</h2><div id="eng-queue"></div></div>
    <div class="panel"><details><summary>Settings</summary><form id="eng-settings" class="settings" style="margin-top:12px"></form></details></div>
    <div class="panel"><h2>History</h2><div class="runs" id="eng-runs"></div></div>
  </section>
  <div id="list" style="display:grid;gap:20px"></div>
</main>
<div id="toast"></div>

<script>
const NETS = [
  ['x', 'X'], ['ig', 'Instagram'], ['fb', 'Facebook'], ['yt', 'YouTube'],
];
const FIELD_LABEL = { text: 'Text', caption: 'Caption', message: 'Text', title: 'Title', description: 'Description' };
const STATE_LABEL = { review: 'in review', ok: 'approved', skip: 'skipped', posted: 'published' };

let showAll = false;
let posts = [];
// Unsaved edits, id -> net -> field -> value. Kept outside the DOM so a card re-rendered after
// another network's save does not lose what is being typed in this one.
const drafts = {};
const preview = {};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(message, kind = 'error') {
  const el = $('#toast');
  el.textContent = message;
  el.className = kind === 'info' ? 'info' : '';
  el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = 'none'; }, kind === 'info' ? 2500 : 8000);
}

async function load() {
  const res = await fetch('/api/posts' + (showAll ? '?all=1' : ''));
  posts = (await res.json()).posts;
  render();
}

async function save(id, net, body) {
  const res = await fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Review': '1' },
    body: JSON.stringify({ id, network: net, ...body }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  const at = posts.findIndex((p) => p.id === id);
  if (at >= 0) posts[at] = data.post;
  return data.post;
}

// X counts every link as 23 characters, whatever its length; the other networks count characters.
function measure(net, value) {
  if (net === 'x') return value.replace(/https?:\/\/\S+/g, 'x'.repeat(23)).length;
  return [...value].length;
}

function draftOf(id, net) {
  return drafts[id]?.[net] || null;
}

function isDirty(id, net) {
  const d = draftOf(id, net);
  return !!d && Object.keys(d).length > 0;
}

function render() {
  const open = posts.filter((p) => p.open);
  $('#summary').textContent = `${posts.filter((p) => p.waiting).length} waiting for review · ${open.length} not fully out yet`;
  const list = $('#list');
  if (!posts.length) {
    list.innerHTML = `<div class="empty">Nothing open. New posts come from <code>plan.mjs</code>, <code>produce.mjs</code>, <code>compose.mjs</code> or <code>generate.mjs</code>.</div>`;
    return;
  }
  list.innerHTML = '';
  for (const post of posts) list.appendChild(renderPost(post));
}

function rerenderPost(id) {
  const old = document.getElementById('post-' + id);
  const post = posts.find((p) => p.id === id);
  if (old && post) old.replaceWith(renderPost(post));
  const open = posts.filter((p) => p.open);
  $('#summary').textContent = `${posts.filter((p) => p.waiting).length} waiting for review · ${open.length} not fully out yet`;
}

function mediaFiles(post) {
  const files = new Map();
  const add = (file, who) => {
    if (!file) return;
    if (!files.has(file)) files.set(file, new Set());
    files.get(file).add(who);
  };
  for (const [net, label] of NETS) {
    const e = post.networks[net];
    if (!e) continue;
    for (const m of e.media) add(m.file, label);
    if (net === 'ig' && e.card) add(e.card, 'Card');
  }
  return [...files.entries()].map(([file, who]) => ({ file, who: [...who].join(', ') }));
}

function renderMedia(post) {
  const files = mediaFiles(post);
  const current = preview[post.id] && files.some((f) => f.file === preview[post.id]) ? preview[post.id] : files[0]?.file;
  const isVideo = current && /\.(mp4|webm|mov)$/i.test(current);
  const src = current ? '/media?file=' + encodeURIComponent(current) : null;
  const needsCard = post.networks.ig?.needs_card && !post.networks.ig?.card;
  let frame;
  if (!src) frame = `<div class="none">${needsCard ? 'Text post – card not rendered yet.<br><code>node render_cards.mjs</code>' : 'No media'}</div>`;
  else if (isVideo) frame = `<video src="${src}" controls muted loop playsinline preload="metadata"></video>`;
  else frame = `<img src="${src}" alt="">`;
  const chips = files.length > 1
    ? `<div class="files">${files.map((f) => `<button data-file="${esc(f.file)}" class="${f.file === current ? 'on' : ''}" title="${esc(f.file)}">${esc(f.who)}</button>`).join('')}</div>`
    : '';
  const l = post.ledger;
  const reference = post.source_text
    ? `<div class="reference"><b>Brief</b>\n${esc(post.source_text)}</div>`
    : '';
  return `<div class="media"><div class="frame${src ? "" : " empty"}">${frame}</div>${chips}${reference}${l?.subject ? `<div class="meta">Subject: ${esc(l.subject)}</div>` : ''}</div>`;
}

function renderNet(post, net, label) {
  const e = post.networks[net];
  if (!e) {
    return `<section class="net"><div class="title"><strong>${label}</strong><span class="meta">no entry${net === 'yt' ? ' – videos only' : ''}</span></div></section>`;
  }
  const locked = e.state === 'posted';
  const draft = draftOf(post.id, net) || {};
  const fields = Object.keys(e.fields).map((field) => {
    const value = draft[field] ?? e.fields[field];
    const length = measure(net, value);
    const limit = e.limits[field];
    const soft = e.soft[field];
    const cls = length > limit ? 'over' : soft && length > soft ? 'soft' : '';
    const counter = `<span class="count ${cls}" data-count="${field}">${length} / ${soft && length <= limit ? soft : limit}</span>`;
    const input = field === 'title'
      ? `<input class="text" data-field="${field}" value="${esc(value)}" ${locked ? 'readonly' : ''}>`
      : `<textarea data-field="${field}" rows="${field === 'text' ? 5 : 8}" ${locked ? 'readonly' : ''}>${esc(value)}</textarea>`;
    return `<label class="field"><span>${FIELD_LABEL[field] || field}</span>${input}${counter}</label>`;
  }).join('');
  const flags = [...e.flags.map((f) => `<span class="flag">${esc(f)}</span>`), ...e.notes.map((n) => `<span class="flag note">${esc(n)}</span>`)];
  if (e.edited) flags.push('<span class="flag note">edited by hand</span>');
  if (e.held) flags.push(`<span class="flag" title="The auto-approval held this back. Approve it by hand, or skip it.">held: ${esc(e.held)}</span>`);
  if (e.approved_by === 'auto') flags.push('<span class="flag note">approved automatically</span>');
  if (net === 'yt' && e.privacy) flags.push(`<span class="flag note">${esc(e.privacy)}</span>`);
  const dirty = isDirty(post.id, net);
  let actions;
  if (locked) {
    const when = e.published_at ? new Date(e.published_at).toLocaleString('en-GB') : '';
    // What metrics.mjs last measured, and at what age: a number from day one is only a beginning.
    const m = e.metrics;
    const reach = m ? `<div class="meta"><b>${m.reach.toLocaleString('en-GB')}</b> reach · <b>${m.interactions}</b> interactions · at ${m.age_days} days</div>` : '';
    actions = `<div class="meta">Published ${esc(when)}${e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">view</a>` : ''}</div>${reach}`;
  } else {
    actions = `<div class="actions">
      ${e.state !== 'ok' ? `<button class="primary" data-act="ok">Approve</button>` : ''}
      ${dirty ? `<button data-act="save">Save</button>` : ''}
      ${e.state !== 'skip' ? `<button data-act="skip">Skip</button>` : ''}
      ${e.state !== 'review' ? `<button data-act="review">Back to review</button>` : ''}
      ${dirty ? '<span class="hint">unsaved</span>' : ''}
    </div>`;
  }
  return `<section class="net" data-net="${net}">
    <div class="title"><strong>${label}</strong><span class="state ${e.state}">${STATE_LABEL[e.state] || e.state}</span></div>
    ${fields}
    ${flags.length ? `<div class="flags">${flags.join('')}</div>` : ''}
    ${actions}
  </section>`;
}

function renderPost(post) {
  const el = document.createElement('article');
  el.className = 'post';
  el.id = 'post-' + post.id;
  const l = post.ledger;
  const reviewable = NETS.filter(([net]) => post.networks[net]?.state === 'review');
  el.innerHTML = `
    <div class="head">
      <span class="date">${esc(new Date(post.date).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }))}</span>
      <span class="id">${esc(post.id)}</span>
      ${l?.format ? `<span class="chip">${esc(l.format)}</span>` : ''}
      ${l?.tone ? `<span class="chip tone">${esc(l.tone)}</span>` : ''}
      <span class="spacer" style="flex:1"></span>
      ${reviewable.length > 1 ? `<button class="primary" data-act="all-ok">Approve all ${reviewable.length}</button>` : ''}
      ${reviewable.length > 1 ? `<button data-act="all-skip">Skip all</button>` : ''}
    </div>
    <div class="body">
      ${renderMedia(post)}
      <div class="nets">${NETS.map(([net, label]) => renderNet(post, net, label)).join('')}</div>
    </div>`;
  wire(el, post);
  return el;
}

function wire(el, post) {
  el.querySelectorAll('.files button').forEach((b) => b.addEventListener('click', () => {
    preview[post.id] = b.dataset.file;
    rerenderPost(post.id);
  }));

  el.querySelectorAll('section.net[data-net]').forEach((section) => {
    const net = section.dataset.net;
    const e = post.networks[net];
    section.querySelectorAll('[data-field]').forEach((input) => input.addEventListener('input', () => {
      const field = input.dataset.field;
      drafts[post.id] ??= {};
      drafts[post.id][net] ??= {};
      if (input.value === e.fields[field]) delete drafts[post.id][net][field];
      else drafts[post.id][net][field] = input.value;
      const length = measure(net, input.value);
      const limit = e.limits[field];
      const soft = e.soft[field];
      const count = section.querySelector(`[data-count="${field}"]`);
      count.textContent = `${length} / ${soft && length <= limit ? soft : limit}`;
      count.className = 'count ' + (length > limit ? 'over' : soft && length > soft ? 'soft' : '');
      // The buttons depend on whether there is something unsaved; swap only that row so the
      // textarea keeps focus and cursor.
      const fresh = document.createElement('div');
      fresh.innerHTML = renderNet(post, net, NETS.find(([n]) => n === net)[1]);
      const row = section.querySelector('.actions');
      const newRow = fresh.querySelector('.actions');
      if (row && newRow) {
        row.replaceWith(newRow);
        wireActions(section, post, net);
      }
    }));
    wireActions(section, post, net);
  });

  el.querySelectorAll('[data-act="all-ok"], [data-act="all-skip"]').forEach((b) => b.addEventListener('click', async () => {
    const status = b.dataset.act === 'all-ok' ? 'ok' : 'skip';
    b.disabled = true;
    for (const [net] of NETS) {
      if (post.networks[net]?.state !== 'review') continue;
      try {
        await commit(post.id, net, status);
      } catch (err) {
        toast(err.message);
        break;
      }
    }
    rerenderPost(post.id);
  }));
}

function wireActions(section, post, net) {
  section.querySelectorAll('.actions [data-act]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      await commit(post.id, net, b.dataset.act === 'save' ? undefined : b.dataset.act);
      toast(b.dataset.act === 'save' ? 'Saved' : `${NETS.find(([n]) => n === net)[1]}: ${STATE_LABEL[b.dataset.act]}`, 'info');
    } catch (err) {
      toast(err.message);
    }
    rerenderPost(post.id);
  }));
}

// Saves what was typed for this network together with the new status, in one write.
async function commit(id, net, status) {
  const fields = draftOf(id, net);
  const body = {};
  if (fields && Object.keys(fields).length) body.fields = fields;
  if (status) body.status = status;
  await save(id, net, body);
  if (drafts[id]) delete drafts[id][net];
}

$('#filter').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (Object.values(drafts).some((d) => Object.values(d).some((f) => Object.keys(f).length))
      && !confirm('Unsaved changes will be lost. Switch anyway?')) return;
  showAll = b.dataset.all === '1';
  $('#filter').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  for (const k of Object.keys(drafts)) delete drafts[k];
  load();
});
$('#reload').addEventListener('click', () => load());
window.addEventListener('beforeunload', (ev) => {
  if (Object.values(drafts).some((d) => Object.values(d).some((f) => Object.keys(f).length))) ev.preventDefault();
});

load().catch((err) => toast('Loading failed: ' + err.message));

// ----- The engine (engine.mjs). When review.mjs serves the page alone there is no /api/engine,
// and this part stays hidden.
const NET_LABEL = Object.fromEntries(NETS);
const DAY_NAMES = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
const FORMAT_NOTE = {
  battle: 'clip, filmed on the live planet', duel: 'card, two units',
  'week-in-numbers': 'card, the week in numbers', devlog: 'card, needs its lines written by hand',
};
const OUTCOME = { published: 'posted', nothing: 'nothing approved', failed: 'failed', login: 'login needed' };
let engine = null;
const when = (iso) => iso
  ? new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
  : '–';
const hasDrafts = () => Object.values(drafts).some((d) => Object.values(d).some((f) => Object.keys(f).length));

async function loadEngine() {
  const res = await fetch('/api/engine');
  if (!res.ok) return;
  const fresh = await res.json();
  // A post the engine just made, approved or published changes the review list below as well.
  const changed = engine && JSON.stringify(engine.runs[0]) !== JSON.stringify(fresh.runs[0]);
  engine = fresh;
  $('#engine').classList.add('on');
  renderEngine();
  if (changed && !hasDrafts()) load();
}

function renderEngine() {
  const e = engine;
  const s = e.settings;
  $('#eng-job').textContent = s.paused ? 'paused' : e.job ? `busy: ${e.job.kind}${e.job.step ? ' – ' + e.job.step : ''}` : 'idle';
  $('#eng-job').className = 'chip' + (s.paused ? ' tone' : '');
  $('#eng-pause').textContent = s.paused ? 'Resume' : 'Pause';
  $('#eng-next').textContent = e.next[0] ? when(e.next[0]) : 'no day or time set';
  $('#eng-perweek').textContent = e.postsPerWeek;
  $('#eng-buffer').textContent = `${e.buffer.level} / ${s.buffer}`;
  $('#eng-buffer-detail').textContent = Object.entries(e.buffer.counts).map(([n, c]) => `${NET_LABEL[n]} ${c}`).join(' · ');
  $('#eng-approval').textContent = s.autoApprove ? 'automatic' : 'by hand';
  renderHealth();
  renderQueue();
  renderRuns();
  if (!$('#eng-settings').contains(document.activeElement)) renderSettings();
  tickCountdown();
}

function tickCountdown() {
  if (!engine) return;
  if (engine.settings.paused || !engine.next[0]) {
    $('#eng-countdown').textContent = engine.settings.paused ? 'paused' : '–';
    return;
  }
  const ms = Math.max(0, Date.parse(engine.next[0]) - Date.now());
  const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60;
  $('#eng-countdown').textContent = (d ? d + 'd ' : '') + [h, m, sec].map((x) => String(x).padStart(2, '0')).join(':');
}
setInterval(tickCountdown, 1000);

function renderHealth() {
  const box = $('#eng-health');
  // A half-typed token must survive the refresh every ten seconds.
  if (box.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  box.innerHTML = NETS.map(([net, label]) => {
    const h = engine.health[net];
    const on = engine.settings.networks[net];
    const r = engine.reconnect[net];
    const statusText = !on ? 'switched off'
      : { ok: 'working', auth: 'login needed', error: 'last post failed', unknown: 'not checked yet' }[h.status] || h.status;
    let fix = '';
    if (on && (h.status === 'auth' || h.status === 'error')) {
      fix = r.kind === 'oauth'
        ? `<a class="button" href="${r.href}" target="_blank" rel="noopener">Reconnect ${label}</a>`
        : `<div class="msg">${esc(r.hint)} <a href="${r.href}" target="_blank" rel="noopener">Open Meta</a></div>
           <input placeholder="new token" data-token="${net}"><div><button data-save-token="${net}">Save token</button></div>`;
    }
    const expires = net === 'ig' && engine.instagramTokenExpires
      ? `<div class="msg">token valid until ${new Date(engine.instagramTokenExpires).toLocaleDateString('en-GB')}, renewed automatically</div>` : '';
    return `<div class="health ${on ? h.status : ''}">
      <div><span class="dot ${on ? h.status : ''}"></span> <strong>${label}</strong> <span class="label">${esc(statusText)}</span></div>
      ${h.message && h.status !== 'ok' ? `<div class="msg">${esc(h.message)}</div>` : ''}
      ${expires}${fix}
      <div class="actions">
        ${on ? `<button data-publish="${net}" title="Posts the next approved post on ${label} now, outside the schedule">Post next now</button>` : ''}
        ${on && (h.status === 'auth' || h.status === 'error') ? `<button data-reset="${net}" title="Mark it as working again; the next slot shows whether it is">Try again</button>` : ''}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-publish]').forEach((b) => b.addEventListener('click', () =>
    call('/api/run', { action: 'publish', net: b.dataset.publish }, `${NET_LABEL[b.dataset.publish]}: posting the next one`)));
  box.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', () => call('/api/health/reset', { net: b.dataset.reset })));
  box.querySelectorAll('[data-save-token]').forEach((b) => b.addEventListener('click', () => {
    const net = b.dataset.saveToken;
    call('/api/token', { net, token: box.querySelector(`[data-token="${net}"]`).value }, 'Token saved');
  }));
}

function renderQueue() {
  const rows = [];
  for (const [net, label] of NETS) for (const q of engine.upcoming[net]) rows.push({ net, label, ...q });
  rows.sort((a, b) => (a.at ? Date.parse(a.at) : Infinity) - (b.at ? Date.parse(b.at) : Infinity));
  if (!rows.length) {
    $('#eng-queue').innerHTML = '<div class="meta">Nothing waiting. The engine makes the next post when the buffer runs low.</div>';
    return;
  }
  const whenCell = (r) => r.at ? esc(when(r.at))
    : r.held ? '<span class="flag">held</span>'
    : r.state === 'review' ? '<span class="state review">in review</span>'
    : engine.health[r.net].status === 'auth' ? '<span class="flag">login needed</span>' : '–';
  $('#eng-queue').innerHTML = `<table class="q"><tr><th>When</th><th>Network</th><th>Post</th><th>Text</th></tr>${rows.map((r) => `<tr>
    <td class="when">${whenCell(r)}</td>
    <td>${esc(r.label)}</td>
    <td><a href="#post-${esc(r.id)}">${esc(r.format || r.id)}</a>${r.auto ? '' : ' <span class="chip">by hand</span>'}</td>
    <td class="text">${esc(r.text)}${r.held ? `<div class="meta">${esc(r.held)}</div>` : ''}</td></tr>`).join('')}</table>`;
}

function describeRun(r) {
  if (r.error && r.kind !== 'login') return `<span class="out-failed">${esc(r.kind)}: ${esc(r.error)}</span>`;
  if (r.kind === 'publish' || r.kind === 'publish-now') {
    const parts = (r.results || []).map((x) => `<span class="out-${x.outcome}">${esc(NET_LABEL[x.net])}: ${esc(OUTCOME[x.outcome] || x.outcome)}` +
      `${x.preview ? ' – ' + esc(x.preview) : ''}${x.message && x.outcome !== 'published' ? ` <span class="meta">(${esc(x.message)})</span>` : ''}</span>`);
    return `<b>${r.kind === 'publish' ? 'Slot' : 'Posted by hand'}</b><br>${parts.join('<br>')}`;
  }
  if (r.kind === 'produce') {
    const made = r.made
      ? `made <a href="#post-${esc(r.made.id)}">${esc(r.made.format)}</a> (${esc(r.made.subject || '')}, ${esc(r.made.tone || '')})`
      : esc(r.note || 'nothing made');
    const held = (r.held || []).map((h) => `<br><span class="out-failed">held on ${esc(NET_LABEL[h.net])}: ${esc(h.reason)}</span>`).join('');
    return `<b>Produce</b> – ${made}${r.approved ? `, ${r.approved} approved` : ''}${held}`;
  }
  if (r.kind === 'login') return `<b>Login</b> ${esc(NET_LABEL[r.net])}: ${r.ok ? 'renewed' : `<span class="out-failed">${esc(r.error)}</span>`}`;
  if (r.kind === 'refresh') return `<b>Token refresh</b> <span class="out-failed">${esc(r.error || '')}</span>`;
  return esc(r.kind);
}

function renderRuns() {
  $('#eng-runs').innerHTML = engine.runs.length
    ? engine.runs.map((r) => `<div class="run"><span class="when">${esc(when(r.at))}</span><span>${describeRun(r)}</span></div>`).join('')
    : '<div class="meta">Nothing yet.</div>';
}

function renderSettings() {
  const s = engine.settings;
  const check = (name, on, text) => `<label><input type="checkbox" name="${name}" ${on ? 'checked' : ''}> ${text}</label>`;
  $('#eng-settings').innerHTML = `
    <fieldset><legend>When posts go out</legend>
      <div class="days">${DAY_NAMES.map(([d, l]) => `<label><input type="checkbox" name="day" value="${d}" ${s.days.includes(d) ? 'checked' : ''}>${l}</label>`).join('')}</div>
      <label>Times <input type="text" name="times" value="${esc(s.times.join(', '))}" title="HH:MM, several separated by commas"></label>
      <span class="meta">Each time on each day is one post per network.</span>
    </fieldset>
    <fieldset><legend>Making posts</legend>
      <label>Keep <input type="number" name="buffer" min="0" max="20" value="${s.buffer}"> posts ready</label>
      <label>Only between <input type="text" name="produceFrom" size="5" value="${esc(s.produceFrom)}"> and <input type="text" name="produceTo" size="5" value="${esc(s.produceTo)}"></label>
      ${Object.entries(s.formats).map(([f, c]) => `<label><input type="checkbox" name="format-on" value="${f}" ${c.enabled ? 'checked' : ''}> ${f}, at most every
        <input type="number" name="gap-${f}" min="0" max="60" value="${c.gapDays}"> days <span class="meta">${esc(FORMAT_NOTE[f] || '')}</span></label>`).join('')}
    </fieldset>
    <fieldset><legend>Approval</legend>
      ${check('autoApprove', s.autoApprove, 'Approve the engine\'s own posts automatically')}
      ${check('approveTemplate', s.approveTemplate, 'Also when the text is only the format\'s template')}
      <legend style="margin-top:8px">Networks</legend>
      ${NETS.map(([n, l]) => check('net-' + n, s.networks[n], l)).join('')}
    </fieldset>
    <fieldset><legend>&nbsp;</legend><div><button class="primary" type="submit">Save settings</button></div></fieldset>`;
}

$('#eng-settings').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const formats = Object.fromEntries(Object.keys(engine.settings.formats).map((name) => [name, {
    enabled: [...f.querySelectorAll('[name=format-on]')].some((x) => x.value === name && x.checked),
    gapDays: Number(f.querySelector(`[name="gap-${name}"]`).value),
  }]));
  call('/api/settings', {
    days: [...f.querySelectorAll('[name=day]:checked')].map((x) => x.value),
    times: f.times.value.split(/[\s,;]+/).filter(Boolean),
    buffer: Number(f.buffer.value),
    produceFrom: f.produceFrom.value.trim(),
    produceTo: f.produceTo.value.trim(),
    formats,
    autoApprove: f.autoApprove.checked,
    approveTemplate: f.approveTemplate.checked,
    networks: Object.fromEntries(NETS.map(([n]) => [n, f['net-' + n].checked])),
  }, 'Settings saved').then(() => { document.activeElement?.blur(); renderSettings(); });
});

async function call(path, body, message) {
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Review': '1' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    engine = data;
    renderEngine();
    if (message) toast(message, 'info');
  } catch (err) {
    toast(err.message);
  }
}

$('#eng-pause').addEventListener('click', () => call('/api/settings', { paused: !engine.settings.paused }, engine.settings.paused ? 'Resumed' : 'Paused'));
$('#eng-produce').addEventListener('click', () => call('/api/run', { action: 'produce' }, 'Making a post – a battle takes a few minutes'));

loadEngine().catch(() => {});
setInterval(() => loadEngine().catch(() => {}), 10_000);
</script>
</body>
</html>
