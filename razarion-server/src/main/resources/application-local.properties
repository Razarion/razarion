# A second checkout runs its own stack on other ports, set in razarion-server/docker/.env (see
# razarion-server/docker/README.md). Without that file these are the usual ports.
# Both paths: mvn spring-boot:run starts in razarion-server, an IDE usually in the repository root.
spring.config.import=optional:file:docker/.env[.properties],optional:file:razarion-server/docker/.env[.properties]
server.port=${RAZ_SERVER_PORT:8080}
spring.datasource.url=jdbc:mariadb://localhost:${RAZ_DB_PORT:32788}/razarion
spring.datasource.username=raz_user
spring.datasource.password=1234

jwt.keystore.location=classpath:dev/jwt-dev-keystore.p12
jwt.keystore.password=devpass
jwt.key.alias=jwt
jwt.key.password=devpass

spring.mongodb.uri=mongodb://localhost:${RAZ_MONGO_PORT:27017}/razarion
spring.mail.port=${RAZ_SMTP_PORT:1025}

# Director mode (film the live world for social-media clips). Both halves are on here: staging a
# battle wrecks the world it happens in, and a local world is the one place where that is free.
razarion.director.enabled=true
razarion.director.staging.enabled=true
# Nobody else is on this planet, so the keep-away-from-players rule has nothing to protect and only
# gets in the way of staging a battle next to the base you just made.
razarion.director.staging.min-human-distance=0
