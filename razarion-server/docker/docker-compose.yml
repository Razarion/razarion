version: '3'
# Ports and container names come from the environment so a second checkout can run its own
# stack next to the first one: put them, with COMPOSE_PROJECT_NAME, into a .env next to this file
# (see README.md). Without a .env everything is as before.

services:
  db:
    image: mariadb
    container_name: ${RAZ_DB_CONTAINER:-db}
    restart: always
    environment:
      MYSQL_DATABASE: razarion
      MYSQL_USER: raz_user
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "${RAZ_DB_PORT:-32788}:3306"
    command: [
      '--wait_timeout=28800',
      '--max_allowed_packet=200000000'
    ]
  #  db_system_test:
  #    image: mariadb
  #    container_name: db_system_test
  #    restart: always
  #    environment:
  #      MYSQL_DATABASE: razarion
  #      MYSQL_USER: raz_user
  #      MYSQL_PASSWORD: 1234
  #      MYSQL_ROOT_PASSWORD: 1234
  #    ports:
  #      - "32788:3306"
  #    command: [
  #      '--wait_timeout=28800',
  #      '--max_allowed_packet=200000000'
  #    ]

  mongo:
    image: mongo
    restart: always
    ports:
      - "${RAZ_MONGO_PORT:-27017}:27017"

  mailhog:
    image: mailhog/mailhog
    container_name: ${RAZ_MAILHOG_CONTAINER:-mailhog}
    ports:
      - "${RAZ_SMTP_PORT:-1025}:1025"   # SMTP port
      - "${RAZ_MAILHOG_UI_PORT:-8025}:8025"   # Web UI http://localhost:8025/#
