<!doctype html>
<html lang="en" class="razarion-frontend-dark">

  <meta name="twitter:description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta name="twitter:image" content="https://razarion.com/card.jpg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Startup tracking starts here, before anything else loads.
     *
     * The engine used to open the session, so a startup only became visible once the Angular
     * bundle and the WebAssembly module had been downloaded and run. Everyone who left before
     * that - by far the largest group of players who never reach the game - produced no record
     * at all and the tracking showed a clean startup list. This opens the session at page load
     * instead, and reports the player leaving while the startup is still running.
     *
     * The window globals below are shared with the client: see PageBootGlobals.java (which
     * documents them) and client-bootstrap.js. Tracking must never break the game, so every
     * step is wrapped and failures are swallowed.
     */
    (function () {
      // The admin backend is not a game startup.
      if (location.pathname.indexOf('/backend') >= 0) {
        return;
      }
      var w = window;
      w.RAZ_gameSessionUuid = 'PG' + Date.now().toString(36).toUpperCase()
        + Math.random().toString(36).slice(2, 10).toUpperCase();
      w.RAZ_currentTask = 'PAGE_LOADED';
      w.RAZ_startupTerminated = null;

      var params = new URLSearchParams(location.search);

      function payload(extra) {
        var body = {
          gameSessionUuid: w.RAZ_gameSessionUuid,
          rdtCid: params.get('rdt_cid'),
          twclid: params.get('twclid'),
          fbclid: params.get('fbclid'),
          utmCampaign: params.get('utm_campaign'),
          utmSource: params.get('utm_source'),
          // The only origin signal left for a visitor who arrives without any parameter at all.
          // Empty string for a direct open, which is worth storing as "nothing" rather than as ''.
          referrer: document.referrer || null
        };
        for (var key in extra) {
          body[key] = extra[key];
        }
        return body;
      }

      // sendBeacon survives the page going away, which a normal fetch does not. Shared with
      // client-bootstrap.js so both halves report the same way.
      w.RAZ_track = function (path, body) {
        try {
          var blob = new Blob([JSON.stringify(body)], {type: 'application/json'});
          if (!navigator.sendBeacon || !navigator.sendBeacon(path, blob)) {
            fetch(path, {method: 'POST', body: blob, keepalive: true}).catch(function () {
            });
          }
        } catch (ignored) {
        }
      };
      w.RAZ_trackPayload = payload;

      // "A browser got this far." Anything that never reports it left during the page load.
      w.RAZ_track('/rest/tracker/startupTask', payload({
        taskEnum: 'PAGE_LOADED',
        startTime: Date.now(),
        duration: 0,
        userAgent: navigator.userAgent,
        error: (typeof WebAssembly === 'undefined') ? 'No WebAssembly support' : null
      }));

      // The player stopped looking at the page. Reported once each for the two cases below.
      var abortReported = false;
      var tabHiddenReported = false;
      var pageLoadedAt = Date.now();
      // Exported so the Angular side can date its own records from the same instant. The moment a
      // player first moves the camera and the moment they give up are only comparable on one clock.
      w.RAZ_pageLoadedAt = pageLoadedAt;

      /*
       * Two different events share one handler because the browser gives us one signal for both.
       *
       * While the startup runs, leaving is an abandoned startup - but switching tabs and closing
       * the page are not the same abandonment: one player is still reachable and comes back to a
       * finished game, the other is gone. That is what `hidden` records.
       *
       * Once the startup ended on its own (RAZ_startupTerminated), leaving is not an abort at
       * all. Backgrounding the game is still worth knowing though: a startup that succeeded
       * while nobody was watching is not a player, and the startup tracking alone cannot tell
       * the difference. It goes to its own endpoint so it can never be mistaken for a failure.
       */
      function leaving(hidden) {
        if (w.RAZ_startupTerminated) {
          if (hidden && !tabHiddenReported) {
            tabHiddenReported = true;
            w.RAZ_track('/rest/tracker/tabHidden', payload({
              millisSincePageLoad: Date.now() - pageLoadedAt
            }));
          }
          return;
        }
        if (abortReported) {
          return;
        }
        abortReported = true;
        w.RAZ_track('/rest/tracker/startupTerminated', payload({
          successful: false,
          aborted: true,
          hidden: hidden,
          lastTaskEnum: w.RAZ_currentTask || 'PAGE_LOADED'
        }));
      }

      addEventListener('pagehide', function () {
        leaving(false);
      });
      // Safari on iOS frequently kills a tab without ever firing pagehide; hidden is the only
      // signal that survives there. It also fires on a plain tab switch, so a player who comes
      // back and finishes still sends a real terminated record - the server drops the abort
      // when a session has both.
      addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          leaving(true);
        }
      });
    })();
  </script>
</head>
<body style="height: 100%; width: 100%; position: absolute">
<!--
  Boot splash. Everything below renders on the first paint, before the Angular bundle has even
  been fetched - which is the whole point, so it has to stay inline. No external stylesheet, no
  webfont, no framework.

  Until this existed the body held nothing but <app-root>, so a player stared at an empty page
  for the seconds it takes to download and start Angular. In the tracking that is the largest
  single group of lost startups: sessions that report PAGE_LOADED and never reach WASM_BOOTSTRAP,
  half of them gone within eight seconds - on current Chrome, so not a compatibility problem.
  They left because nothing indicated that anything was happening.

  The bar is deliberately indeterminate: at this stage nobody can say how far along the download
  is, and a made-up number that crawls is worse than an honest "working on it". The real,
  measured bar takes over in ScreenCoverComponent, which also removes this splash.
-->
<div id="raz-boot">
  <div id="raz-boot-card">
    <div id="raz-boot-title">Razarion &ndash; RTS meets MMO: One shared world that never stops</div>
    <div id="raz-boot-box">
      <div id="raz-boot-label">Loading&hellip;</div>
      <div id="raz-boot-track">
        <div id="raz-boot-fill"></div>
      </div>
    </div>
    <ul id="raz-boot-tips">
      <li>Arrow keys or WASD to scroll the map</li>
      <li>Mouse to place and command units</li>
      <li>Mouse wheel to zoom in and out</li>
    </ul>
  </div>
</div>
<style>
  /* Mirrors screen-cover.component.scss so the handover to Angular is not a visible jump. Both
     files carry the same background and the same portrait swap below; changing one alone shows up
     as a flash the moment Angular takes over. */
  #raz-boot {
    --hero: url("/razarion-bg.webp");
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    background: linear-gradient(180deg, rgba(10, 10, 18, 0.2) 0%, rgba(10, 10, 18, 0.5) 50%, rgba(10, 10, 18, 0.8) 100%), var(--hero) center/cover no-repeat;
    font-family: Arial, Helvetica, sans-serif;
    color: #CCC;
  }

  /* The 16:9 hero laid over a portrait frame by center/cover shows 27% of its width - a gear
     fragment over empty beach. Same treatment as the landing page: a picture cut for the shape. */
  @media (max-aspect-ratio: 3/4) {
    #raz-boot {
      --hero: url("/razarion-bg-portrait.webp");
    }
  }

  /* The cockpit plate, by hand. This is @mixin hud-plate from _hud-panels.scss and the .hud-plate
     class .cover-panel-center wears - the same recipe, spelled out, because this card paints
     before any stylesheet exists and cannot reach a Sass mixin or a CSS variable. All three copies
     have to change together, or the handover to Angular flashes. */
  #raz-boot-card {
    position: absolute;
    width: 40em;
    max-width: calc(100% - 2em);
    box-sizing: border-box;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 10px;
    border: 4px solid transparent;
    border-radius: 12px;
    background-image:
      radial-gradient(120% 180% at 50% 0%, rgba(46, 100, 148, 0.32) 0%, rgba(8, 16, 27, 0) 62%),
      linear-gradient(180deg, #0e1d2f 0%, #081422 55%, #050d17 100%),
      linear-gradient(180deg,
        #d3dde7 0%, #9aa8b7 5%, #64717f 22%,
        #3b4551 52%, #242c36 78%, #6f7b89 96%, #b3bfcc 100%);
    background-origin: padding-box, padding-box, border-box;
    background-clip: padding-box, padding-box, border-box;
    box-shadow:
      0 0 0 1px #0b1017,
      0 8px 22px rgba(0, 0, 0, 0.6),
      inset 0 0 0 1px rgba(96, 168, 224, 0.26);
    color: #cfe0f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #raz-boot-title {
    padding: 0.75rem 0.5rem 1rem;
  }

  /* Mirrors .cover-progress-well in screen-cover.component.scss. */
  #raz-boot-box {
    border-radius: 8px;
    padding: 0.25rem;
    background: rgba(4, 10, 18, 0.6);
    box-shadow: inset 0 0 0 1px rgba(96, 168, 224, 0.26);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }

  #raz-boot-label {
    padding-left: 0.5rem;
  }

  /* 28em/1.1em are the dimensions of the p-progressbar this hands over to, and the trough is the
     same near-black rail with a cyan rim that .hud-xp-fill-track wears in the cockpit. */
  #raz-boot-track {
    position: relative;
    width: 28em;
    max-width: 60%;
    height: 1.1em;
    overflow: hidden;
    background-color: #06101c;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(99, 200, 255, 0.25);
  }

  #raz-boot-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 35%;
    background-color: #10b981;
    animation: raz-boot-sweep 1.6s ease-in-out infinite;
  }

  @keyframes raz-boot-sweep {
    0% { left: -35%; }
    100% { left: 100%; }
  }

  /* A sweeping bar is motion for its own sake to anyone who asked the system to stop animating. */
  @media (prefers-reduced-motion: reduce) {
    #raz-boot-fill {
      animation: none;
      left: 0;
      width: 100%;
      opacity: 0.35;
    }
  }

  #raz-boot-tips {
    list-style: none;
    margin: 0;
    padding: 0.5rem;
  }

  #raz-boot-tips li {
    padding: 0.3rem 0;
  }
</style>
<script>
  /*
   * The splash belongs to the game only. The backend and the auth pages are ordinary Angular
   * views with no WebAssembly behind them, and covering them with a game loading screen would
   * be wrong. Kept in sync with the route table in app.routes.ts.
   */
  (function () {
    var path = location.pathname;
    if (path.indexOf('/backend') >= 0
      || path.indexOf('/invalid-token') >= 0
      || path.indexOf('/verify-email') >= 0) {
      var splash = document.getElementById('raz-boot');
      if (splash) {
        splash.parentNode.removeChild(splash);
      }
    }
  })();
</script>
<app-root></app-root>
</body>
</html>
