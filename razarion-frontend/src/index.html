<!doctype html>
<html lang="en" class="razarion-frontend-dark">
<head>
  <meta charset="utf-8">
  <script>
    /*
     * Resource timing keeps 250 entries and then silently drops everything after them.
     *
     * A game start fetches 675 JavaScript chunks before one line of our own code runs, so by the
     * time anything of ours could raise this, the buffer has been full for seconds - and the
     * WebAssembly, the models and the textures, which is what STARTUP_PAYLOAD exists to weigh,
     * never appear at all. The first measurement read as "1.1 MB, and nothing more arrived after
     * the game was playable", which is not a thing that happens.
     *
     * It has to be here, ahead of every tag that fetches something: raising the limit afterwards
     * does not bring back what was already dropped. The flag exists so this can never again be
     * silent - a truncated measurement says so in its own detail rather than looking complete.
     */
    try {
      performance.setResourceTimingBufferSize(20000);
      addEventListener('resourcetimingbufferfull', function () {
        window.RAZ_resourceBufferFull = 1;
      });
    } catch (ignored) {
    }
  </script>
  <title>Razarion – RTS meets MMO: One World That Never Stops</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta property="og:title" content="Razarion – RTS meets MMO: One World That Never Stops">
  <meta property="og:description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://razarion.com">
  <meta property="og:image" content="https://razarion.com/card.jpg">
  <meta property="og:site_name" content="Razarion">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@razariongame">
  <meta name="twitter:title" content="Razarion – RTS meets MMO: One World That Never Stops">
  <meta name="twitter:description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta name="twitter:image" content="https://razarion.com/card.jpg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Startup tracking starts here, before anything else loads.
     *
     * The engine used to open the session, so a startup only became visible once the Angular
     * bundle and the WebAssembly module had been downloaded and run. Everyone who left before
     * that - by far the largest group of players who never reach the game - produced no record
     * at all and the tracking showed a clean startup list. This opens the session at page load
     * instead, and reports the player leaving while the startup is still running.
     *
     * The window globals below are shared with the client: see PageBootGlobals.java (which
     * documents them) and client-bootstrap.js. Tracking must never break the game, so every
     * step is wrapped and failures are swallowed.
     */
    (function () {
      // The admin backend is not a game startup.
      if (location.pathname.indexOf('/backend') >= 0) {
        return;
      }
      var w = window;
      w.RAZ_gameSessionUuid = 'PG' + Date.now().toString(36).toUpperCase()
        + Math.random().toString(36).slice(2, 10).toUpperCase();
      w.RAZ_currentTask = 'PAGE_LOADED';
      w.RAZ_startupTerminated = null;

      /*
       * Two loading screens, half the players each. Without the split they would be compared
       * across different days with different traffic, and the last time that was done the step in
       * the numbers turned out to be a campaign change rather than the deploy.
       *
       * plain  the card that was here before, and the control: it is what the historical numbers
       *        were measured on, and it still lands on them.
       * grid   the world being built, drawn on a canvas. The bet is that showing the player the
       *        view he is about to get is what makes waiting bearable.
       *
       * There was a third for a day: a boot log, on the argument that a pause between two lines
       * is what a boot log does, where a still frame inside a moving picture reads as a crash.
       * Measured over the same hours as the other two, against the same audience: console 34.6%
       * reaching the game against plain 54.9% and grid 49.3%, n = 162/142/140, z = 3.6 against
       * plain. Checked on a phone three times before removing it - it was not broken, it was
       * worse.
       *
       * The reason is the thing it was built for. A console does not hide a pause, it timestamps
       * one: "starting engine 63%" sits there and the seconds can be counted off it. A sweeping
       * bar and a building world are ambiguous about how long is left, and ambiguity turns out to
       * be worth more than honesty here. The argument for it was exactly backwards.
       *
       * ?boot=grid|plain forces one, for looking at it on purpose. It sticks to the browser
       * afterwards - not just the tab, which died with every window and sent the next test back
       * to the coin flip. A flip that lands on plain twice running is indistinguishable from a
       * broken animation, and it was taken for one four times before this was written.
       * ?boot=off forgets it again. Nobody who does not pass the parameter is ever pinned.
       */
      var VARIANTS = ['plain', 'grid'];
      var forced = new URLSearchParams(location.search).get('boot');
      var remembered = null;
      try {
        if (forced === 'off') {
          localStorage.removeItem('razBoot');
        } else if (VARIANTS.indexOf(forced) >= 0) {
          localStorage.setItem('razBoot', forced);
        }
        remembered = localStorage.getItem('razBoot');
      } catch (ignored) {
        // A browser that refuses storage still gets a variant, just not a sticky one.
      }
      /*
       * A name for this browser that outlives the session, so that "did anybody come back?" has
       * an answer.
       *
       * Today it does not. An unregistered player's userId is handed out by UserService from a
       * ConcurrentHashMap keyed on the http session, so it dies with the session and with every
       * restart of the pod - and this deploys several times a day. Measured over thirty days: 385
       * players built a base, 381 of them appear on exactly one calendar day. That number is not
       * a fact about the game, it is the shape of an identity that cannot survive until tomorrow.
       *
       * Deliberately NOT the userId. This changes nothing about who the player is: it does not
       * restore a base, it does not log anybody in, the server does not read it. It exists so the
       * tracking can tell two visits by the same browser apart from two visits by two browsers,
       * and nothing else.
       *
       * Note what it is, though: a durable identifier in the visitor's storage, which is the one
       * thing the click-id handling here has always avoided - rdtCid, twclid and fbc are held in
       * memory on purpose. This is first-party, opaque and random, and it is never sent anywhere
       * but to this server. It is still a persistent identifier, and it belongs in the privacy
       * policy beside the others.
       *
       * Carried in the capabilities catalogue for the same reason the boot arm is: that line is
       * the only thing every session sends before anything else, including the sessions that end
       * during the bundle. A browser that refuses storage simply has no name and stays
       * uncountable, which is the honest failure.
       */
      try {
        var visitor = localStorage.getItem('razVisitor');
        if (!visitor) {
          visitor = 'V' + Date.now().toString(36).toUpperCase()
            + Math.random().toString(36).slice(2, 10).toUpperCase();
          localStorage.setItem('razVisitor', visitor);
        }
        w.RAZ_visitorId = visitor;
      } catch (ignored) {
        // No storage, no name. The session still reports everything else.
      }

      var chosen = VARIANTS.indexOf(forced) >= 0 ? forced : remembered;
      w.RAZ_bootVariant = VARIANTS.indexOf(chosen) >= 0
        ? chosen
        : VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
      /*
       * Said out loud, because "did I see the animation or did I get the other half" is not a
       * question anybody should have to answer by staring at a loading screen.
       */
      try {
        console.log('[Razarion] Ladebildschirm: ' + w.RAZ_bootVariant
          + (chosen ? ' (erzwungen)' : ' (Zufall)'));
      } catch (ignored) {
      }

      /*
       * Second arm, same coin: how big the shadow map is. See ShadowQuality in the renderer for
       * what the two halves do and why 4096 on a 640-pixel-wide phone is 61 shadow texels per
       * visible pixel.
       *
       * Decided here rather than in the renderer, for the reason the boot arm is decided here: it
       * has to reach the capabilities catalogue, which is the only thing a session sends before
       * anything else. That is what lets the question be "did the faster arm build more bases",
       * not merely "was the faster arm faster" - the second one the telemetry answers on its own.
       *
       * Sticky per browser, like the other two. A player who gets a different shadow map on every
       * reload is a player whose two visits cannot be compared, and comparing visits is the whole
       * point of razVisitor above.
       *
       * ?shadow=hi|lo forces one, ?shadow=off forgets it. "hi" is the behaviour that ships today.
       */
      var SHADOW_ARMS = ['hi', 'lo'];
      var forcedShadow = new URLSearchParams(location.search).get('shadow');
      var rememberedShadow = null;
      try {
        if (forcedShadow === 'off') {
          localStorage.removeItem('razShadow');
        } else if (SHADOW_ARMS.indexOf(forcedShadow) >= 0) {
          localStorage.setItem('razShadow', forcedShadow);
        }
        rememberedShadow = localStorage.getItem('razShadow');
      } catch (ignored) {
      }
      var chosenShadow = SHADOW_ARMS.indexOf(forcedShadow) >= 0 ? forcedShadow : rememberedShadow;
      w.RAZ_shadowArm = SHADOW_ARMS.indexOf(chosenShadow) >= 0
        ? chosenShadow
        : SHADOW_ARMS[Math.floor(Math.random() * SHADOW_ARMS.length)];

      /*
       * Third arm, and a separate coin from the one above on purpose: whether the scenery casts
       * shadows at all. See ShadowCasters in the renderer - the shadow pass draws the whole scene
       * a second time, and PROD says the vegetation is almost all of it.
       *
       * Two independent flips rather than one four-way choice. Each effect is then read at the
       * full sample size, averaged over the other, instead of cutting thin traffic into quarters.
       *
       * ?casters=all|units forces one, ?casters=off forgets it. "all" is what ships today.
       */
      var CASTER_ARMS = ['all', 'units'];
      var forcedCasters = new URLSearchParams(location.search).get('casters');
      var rememberedCasters = null;
      try {
        if (forcedCasters === 'off') {
          localStorage.removeItem('razCasters');
        } else if (CASTER_ARMS.indexOf(forcedCasters) >= 0) {
          localStorage.setItem('razCasters', forcedCasters);
        }
        rememberedCasters = localStorage.getItem('razCasters');
      } catch (ignored) {
      }
      var chosenCasters = CASTER_ARMS.indexOf(forcedCasters) >= 0 ? forcedCasters : rememberedCasters;
      w.RAZ_casterArm = CASTER_ARMS.indexOf(chosenCasters) >= 0
        ? chosenCasters
        : CASTER_ARMS[Math.floor(Math.random() * CASTER_ARMS.length)];

      var params = new URLSearchParams(location.search);

      function payload(extra) {
        var body = {
          gameSessionUuid: w.RAZ_gameSessionUuid,
          rdtCid: params.get('rdt_cid'),
          twclid: params.get('twclid'),
          fbclid: params.get('fbclid'),
          utmCampaign: params.get('utm_campaign'),
          utmSource: params.get('utm_source'),
          // The only origin signal left for a visitor who arrives without any parameter at all.
          // Empty string for a direct open, which is worth storing as "nothing" rather than as ''.
          referrer: document.referrer || null
        };
        for (var key in extra) {
          body[key] = extra[key];
        }
        return body;
      }

      // sendBeacon survives the page going away, which a normal fetch does not. Shared with
      // client-bootstrap.js so both halves report the same way.
      w.RAZ_track = function (path, body) {
        try {
          var blob = new Blob([JSON.stringify(body)], {type: 'application/json'});
          if (!navigator.sendBeacon || !navigator.sendBeacon(path, blob)) {
            fetch(path, {method: 'POST', body: blob, keepalive: true}).catch(function () {
            });
          }
        } catch (ignored) {
        }
      };
      w.RAZ_trackPayload = payload;

      /*
       * What this browser can do, measured rather than assumed.
       *
       * Half of the sessions from the Meta in-app browser stop at PAGE_LOADED and never reach the
       * WASM client, and the standing explanation was that the embedded webview cannot carry it -
       * no WebGL2, no WASM-GC, no cross-origin isolation for the worker. Nothing in the data said
       * so either way, because nothing asked. This asks, on every session, from the one place that
       * runs before the Angular bundle - which is the point, since the sessions in question never
       * get past that bundle.
       *
       * Reported always, not only on failure. A field that is written only when something breaks
       * cannot distinguish "everything was fine" from "the check never ran", and that ambiguity is
       * exactly what made WASM_LOAD unreadable.
       *
       * The WASM-GC probe validates a module whose type section declares a struct (0x5F). A
       * browser without GC does not know that type and rejects the module - verified against a
       * browser that does support it, and against a deliberately wrong type byte, which is
       * rejected. Everything here is wrapped: a capability probe must never cost a startup.
       */
      function capabilities() {
        var parts = [];
        function add(name, value) {
          parts.push(name + '=' + (value === true ? 1 : value === false ? 0 : value));
        }
        try {
          add('wasm', typeof WebAssembly !== 'undefined');
          add('wasmgc', typeof WebAssembly !== 'undefined' && WebAssembly.validate(
            new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 0x5F, 1, 0x78, 0])));
        } catch (ignored) {
          add('wasmgc', 'error');
        }
        try {
          // The context is released again straight away. On a phone the renderer is about to ask
          // for one of its own, and two live contexts on a tight device is a cost this has no
          // business adding.
          var gl = document.createElement('canvas').getContext('webgl2');
          add('webgl2', !!gl);
          if (gl) {
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) {
              lose.loseContext();
            }
          }
        } catch (ignored) {
          add('webgl2', 'error');
        }
        // Which loading screen this session gets. A coin flip, decided here because this line is
        // the only one every session sends before anything else - including the sessions that
        // leave during the bundle, which are the ones the experiment is about. Carried in the
        // capabilities catalogue rather than in a field of its own: the record it would have to
        // reach is the abort beacon, and that one is joined to this by the game session uuid
        // anyway.
        add('boot', w.RAZ_bootVariant);
        // Which shadow map this session gets, for the same reason and joined the same way. The
        // renderer repeats it on every telemetry line; this copy is the one that reaches the
        // sessions which never get as far as a rendered frame.
        add('shadow', w.RAZ_shadowArm);
        add('casters', w.RAZ_casterArm);
        // The browser's own name, where there is one. See where it is made, above.
        if (w.RAZ_visitorId) {
          add('vid', w.RAZ_visitorId);
        }
        try {
          add('coi', self.crossOriginIsolated === true);
          add('sab', typeof SharedArrayBuffer !== 'undefined');
          add('mem', navigator.deviceMemory || 0);
          add('cores', navigator.hardwareConcurrency || 0);
        } catch (ignored) {
        }
        return parts.join(',');
      }

      // "A browser got this far." Anything that never reports it left during the page load.
      w.RAZ_track('/rest/tracker/startupTask', payload({
        taskEnum: 'PAGE_LOADED',
        startTime: Date.now(),
        duration: 0,
        userAgent: navigator.userAgent,
        capabilities: capabilities(),
        error: (typeof WebAssembly === 'undefined') ? 'No WebAssembly support' : null
      }));

      // The player stopped looking at the page. Reported once each for the two cases below.
      var abortReported = false;
      var tabHiddenReported = false;
      var pageLoadedAt = Date.now();
      // Exported so the Angular side can date its own records from the same instant. The moment a
      // player first moves the camera and the moment they give up are only comparable on one clock.
      w.RAZ_pageLoadedAt = pageLoadedAt;

      /*
       * Two different events share one handler because the browser gives us one signal for both.
       *
       * While the startup runs, leaving is an abandoned startup - but switching tabs and closing
       * the page are not the same abandonment: one player is still reachable and comes back to a
       * finished game, the other is gone. That is what `hidden` records.
       *
       * Once the startup ended on its own (RAZ_startupTerminated), leaving is not an abort at
       * all. Backgrounding the game is still worth knowing though: a startup that succeeded
       * while nobody was watching is not a player, and the startup tracking alone cannot tell
       * the difference. It goes to its own endpoint so it can never be mistaken for a failure.
       */
      function leaving(hidden) {
        if (w.RAZ_startupTerminated) {
          if (hidden && !tabHiddenReported) {
            tabHiddenReported = true;
            w.RAZ_track('/rest/tracker/tabHidden', payload({
              millisSincePageLoad: Date.now() - pageLoadedAt
            }));
          }
          return;
        }
        if (abortReported) {
          return;
        }
        abortReported = true;
        w.RAZ_track('/rest/tracker/startupTerminated', payload({
          successful: false,
          aborted: true,
          hidden: hidden,
          lastTaskEnum: w.RAZ_currentTask || 'PAGE_LOADED',
          // How long they were willing to wait. Three quarters of the aborts happen while the
          // JavaScript is still arriving, and until this field there was no way to tell a player
          // who never looked from one who watched the loading screen for fifteen seconds. Same
          // origin as the tabHidden beacon above, so the two are comparable.
          millisSincePageLoad: Date.now() - pageLoadedAt,
          /*
           * And whether there was anything moving while they waited.
           *
           * The same two counters STARTUP_TIMING carries - but that one is sent from inside the
           * application, so only players who got that far ever reported them. The people this
           * experiment is about are the ones who did not, and about them the counters said
           * nothing. Undefined in the unanimated half, where JSON.stringify drops the pair and
           * the record keeps "no animation was running" apart from "it never got a frame".
           */
          bootFrames: w.RAZ_bootFrames,
          bootMaxGap: w.RAZ_bootMaxGap
        }));
      }

      addEventListener('pagehide', function () {
        leaving(false);
      });
      // Safari on iOS frequently kills a tab without ever firing pagehide; hidden is the only
      // signal that survives there. It also fires on a plain tab switch, so a player who comes
      // back and finishes still sends a real terminated record - the server drops the abort
      // when a session has both.
      addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          leaving(true);
        }
      });
    })();
  </script>
</head>
<body style="height: 100%; width: 100%; position: absolute">
<!--
  Boot splash. Everything below renders on the first paint, before the Angular bundle has even
  been fetched - which is the whole point, so it has to stay inline. No external stylesheet, no
  webfont, no framework.

  Until this existed the body held nothing but <app-root>, so a player stared at an empty page
  for the seconds it takes to download and start Angular. In the tracking that is the largest
  single group of lost startups: sessions that report PAGE_LOADED and never reach WASM_BOOTSTRAP,
  half of them gone within eight seconds - on current Chrome, so not a compatibility problem.
  They left because nothing indicated that anything was happening.

  The bar is deliberately indeterminate: at this stage nobody can say how far along the download
  is, and a made-up number that crawls is worse than an honest "working on it". The real,
  measured bar takes over in ScreenCoverComponent, which also removes this splash.
-->
<div id="raz-boot">
  <canvas id="raz-boot-grid" aria-hidden="true"></canvas>
  <div id="raz-boot-card">
    <div id="raz-boot-title">Razarion &ndash; RTS meets MMO: One shared world that never stops</div>
    <div id="raz-boot-box">
      <div id="raz-boot-label">Loading&hellip;</div>
      <div id="raz-boot-track">
        <div id="raz-boot-fill"></div>
      </div>
    </div>
    <ul id="raz-boot-tips">
      <li>Arrow keys or WASD to scroll the map</li>
      <li>Mouse to place and command units</li>
      <li>Mouse wheel to zoom in and out</li>
    </ul>
  </div>
</div>
<style>
  /* Mirrors screen-cover.component.scss so the handover to Angular is not a visible jump. Both
     files carry the same background and the same portrait swap below; changing one alone shows up
     as a flash the moment Angular takes over. */
  /* No picture behind it any more. The build-up is what there is to look at, and a photograph
     under it was something to see through rather than something to see. */
  #raz-boot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    background: linear-gradient(180deg, #0b1420 0%, #070e18 55%, #04080f 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: #CCC;
  }

  /* No portrait variant any more: the picture above is already taller than it is wide, so
     center/cover keeps its subject in both shapes. */

  /* The cockpit plate, by hand. This is @mixin hud-plate from _hud-panels.scss and the .hud-plate
     class .cover-panel-center wears - the same recipe, spelled out, because this card paints
     before any stylesheet exists and cannot reach a Sass mixin or a CSS variable. All three copies
     have to change together, or the handover to Angular flashes. */
  #raz-boot-card {
    position: absolute;
    width: 40em;
    max-width: calc(100% - 2em);
    box-sizing: border-box;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 10px;
    border: 4px solid transparent;
    border-radius: 12px;
    background-image:
      radial-gradient(120% 180% at 50% 0%, rgba(46, 100, 148, 0.32) 0%, rgba(8, 16, 27, 0) 62%),
      linear-gradient(180deg, #0e1d2f 0%, #081422 55%, #050d17 100%),
      linear-gradient(180deg,
        #d3dde7 0%, #9aa8b7 5%, #64717f 22%,
        #3b4551 52%, #242c36 78%, #6f7b89 96%, #b3bfcc 100%);
    background-origin: padding-box, padding-box, border-box;
    background-clip: padding-box, padding-box, border-box;
    box-shadow:
      0 0 0 1px #0b1017,
      0 8px 22px rgba(0, 0, 0, 0.6),
      inset 0 0 0 1px rgba(96, 168, 224, 0.26);
    color: #cfe0f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #raz-boot-title {
    padding: 0.75rem 0.5rem 1rem;
  }

  /* Mirrors .cover-progress-well in screen-cover.component.scss. */
  #raz-boot-box {
    border-radius: 8px;
    padding: 0.25rem;
    background: rgba(4, 10, 18, 0.6);
    box-shadow: inset 0 0 0 1px rgba(96, 168, 224, 0.26);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }

  #raz-boot-label {
    padding-left: 0.5rem;
  }

  /* 28em/1.1em are the dimensions of the p-progressbar this hands over to, and the trough is the
     same near-black rail with a cyan rim that .hud-xp-fill-track wears in the cockpit. */
  #raz-boot-track {
    position: relative;
    width: 28em;
    max-width: 60%;
    height: 1.1em;
    overflow: hidden;
    background-color: #06101c;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(99, 200, 255, 0.25);
  }

  #raz-boot-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 35%;
    background-color: #10b981;
    animation: raz-boot-sweep 1.6s ease-in-out infinite;
  }

  @keyframes raz-boot-sweep {
    0% { left: -35%; }
    100% { left: 100%; }
  }

  /* A sweeping bar is motion for its own sake to anyone who asked the system to stop animating. */
  @media (prefers-reduced-motion: reduce) {
    #raz-boot-fill {
      animation: none;
      left: 0;
      width: 100%;
      opacity: 0.35;
    }
  }

  #raz-boot-tips {
    list-style: none;
    margin: 0;
    padding: 0.5rem;
  }

  #raz-boot-tips li {
    padding: 0.3rem 0;
  }

  /* The build-up sits behind the card and over the hero, so the world looks like it is being
     assembled rather than waited for. Transparent where nothing is drawn, which keeps the hero
     visible and the handover to Angular on the same backdrop. */
  #raz-boot-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* What the renderer hands over with, instead of the splash being cut away. */
  #raz-boot.raz-boot-leaving {
    opacity: 0;
    transition: opacity 450ms ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    #raz-boot.raz-boot-leaving {
      transition: none;
    }
  }
</style>
<script>
  /*
   * The splash belongs to the game only. The backend and the auth pages are ordinary Angular
   * views with no WebAssembly behind them, and covering them with a game loading screen would
   * be wrong. Kept in sync with the route table in app.routes.ts.
   */
  (function () {
    var path = location.pathname;
    if (path.indexOf('/backend') >= 0
      || path.indexOf('/invalid-token') >= 0
      || path.indexOf('/verify-email') >= 0) {
      var splash = document.getElementById('raz-boot');
      if (splash) {
        splash.parentNode.removeChild(splash);
      }
    }
  })();
</script>
<script>
  /*
   * The loading screen, as a world being built.
   *
   * For the first five seconds of an in-app start nothing on this page changes: a static hero, a
   * sweeping stripe and three tips. Three quarters of every abandoned start happen inside exactly
   * that window, and 60% of those players still had the tab in front of them - they watched a
   * frozen picture and left. This draws a terrain grid instead, filling in from the horizon, then
   * objects standing up on it, then colour: the shape of the game arriving.
   *
   * It is a fake, and deliberately so. The real renderer cannot draw anything until 2.4 MB of
   * JavaScript has arrived, which is the wait being covered. What it must not be is a lie about
   * progress, so the build-up is driven by the bytes actually landing rather than by a timer: it
   * cannot finish early on a slow connection and it cannot crawl on a fast one. Only the sweep
   * moves on its own, so a stalled download still looks alive rather than hung.
   *
   * Canvas 2D and nothing else. A downloaded asset would compete for the bandwidth this exists to
   * cover: at the 5 Mbit/s an in-app webview gets, every 500 KB of animation costs another second
   * of the wait it is meant to hide.
   *
   * Which half of the players see it is decided by RAZ_bootVariant in the tracking script above,
   * and reported with the capabilities line - see the comment there.
   */
  (function () {
    var canvas = document.getElementById('raz-boot-grid');
    if (!canvas || !canvas.getContext || window.RAZ_bootVariant !== 'grid') {
      if (canvas && canvas.parentNode) {
        canvas.parentNode.removeChild(canvas);
      }
      return;
    }
    var ctx;
    try {
      ctx = canvas.getContext('2d');
    } catch (ignored) {
      return;
    }
    if (!ctx) {
      return;
    }
    var reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    /*
     * The card goes, and with it the title, the bar and the three tips.
     *
     * It sits in the middle of the screen - forty ems wide, nearly the whole width of a phone -
     * which is exactly where the build front is during the first seconds. The report that came
     * back from a phone was "I did not see it", and a panel over the only part that moves is at
     * least as good an explanation as anything else.
     *
     * So this half of the players gets the build and nothing else. It carries its own progress:
     * how far the plane has come is how far the start has come, which is the thing a bar was
     * saying in words. The other half keeps the card, because the other half is the screen this
     * is being measured against.
     *
     * Not when the system asked for less motion. There the build is drawn once and stands still,
     * and a still picture with no word on it is a page that looks broken.
     */
    if (!reduced) {
      var card = document.getElementById('raz-boot-card');
      if (card) {
        card.style.display = 'none';
      }
    }

    // The JavaScript this screen waits for, measured on the deployed build: 186 kB of eager
    // bundle plus the game chunk, 2,740 kB together over the wire. Only the scale of the fill -
    // the clamp below means a wrong number shows as a slightly fast or slow build-up and never as
    // anything worse.
    var EXPECTED_BYTES = 2750 * 1024;
    var GREEN = '99, 232, 176';
    var CYAN = '99, 200, 255';

    var width = 0;
    var height = 0;

    function resize() {
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = canvas.clientWidth || window.innerWidth;
      height = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    resize();
    addEventListener('resize', resize);

    /*
     * How far along the download is, from the bytes that have actually landed.
     *
     * Recounted from the whole buffer rather than accumulated, which is both simpler and immune to
     * counting an entry twice. index.html raises the resource timing buffer to 20000 in the first
     * script on the page, so nothing is dropped. A warm start reports transferSize 0 and a body
     * size instead - counting only the wire would leave a returning player looking at a grid that
     * never builds.
     */
    var bytes = 0;
    // Below zero until the application reports for the first time, which is also how the page
    // knows Angular is alive without asking.
    var enginePart = -1;
    var demoProgress = 0;
    /*
     * Watching it on purpose. An in-app player waits about five seconds for the bundle and sees
     * the whole build; on localhost it is over before the eye catches it, which is not a fault in
     * the animation but does make it impossible to look at. ?bootDemo=8 stretches it over eight
     * seconds, ?bootDemo over twelve. Never reached without the parameter.
     */
    var demoParam = new URLSearchParams(location.search).get('bootDemo');
    var demoMillis = demoParam === null ? 0 : (Number(demoParam) || 12) * 1000;
    var started = 0;

    function recount() {
      var total = 0;
      var entries;
      try {
        entries = performance.getEntriesByType('resource');
      } catch (ignored) {
        return;
      }
      for (var i = 0; i < entries.length; i++) {
        var entry = entries[i];
        /*
         * Only the JavaScript, because only the JavaScript is what this screen waits for: the
         * splash is taken down by ScreenCoverComponent, which exists once the game chunk has run.
         * The engine module, the hero and the materials all arrive in the same seconds and would
         * push the build-up to finished while the player is still waiting - which is the one thing
         * a progress display may not do.
         */
        if (entry.name.indexOf('.js') < 0) {
          continue;
        }
        total += entry.transferSize || entry.encodedBodySize || 0;
      }
      bytes = total;
    }

    // A fixed pattern, so the picture is the same every time and nothing jitters between frames.
    var seed = 0x2f6e2b1;

    function random() {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    }

    /*
     * Buildings, in world units on the ground plane. Sizes and heights are roughly what the game's
     * own put there: a factory covers a few nodes and stands a handful of units tall.
     */
    var objects = [];
    for (var i = 0; i < 26; i++) {
      objects.push({
        x: Math.round((random() - 0.5) * 120 / 6) * 6,
        // Not right in the camera's face: a box at the near edge fills a third of the frame.
        z: Math.round((-6 + random() * 66) / 6) * 6,
        size: 3 + Math.round(random() * 3),
        tall: 2 + random() * 5,
        // Spread across the middle of the build so they keep arriving the whole way through.
        at: 0.3 + random() * 0.5
      });
    }

    /*
     * The camera the game actually uses, so that what builds up under the loading screen is the
     * view the player is handed when it goes away.
     *
     * BabylonRenderServiceAccessImpl puts a FreeCamera at (0, 30, -35) looking at the origin and
     * never turns it - only the position moves, and updateCameraHeight keeps it 30 above the ground
     * under the view centre. The field of view is Babylon's default 0.8 rad, vertical.
     *
     * That comes to 40.6 degrees below the horizontal, and it has a consequence the first version
     * of this screen got wrong: at that pitch the horizon projects to 2.03 in normalised device
     * coordinates, which is above the top of the frame. The game never shows sky. A loading screen
     * with a horizon a third of the way down and black above it is not this game seen early, it is
     * a different game.
     */
    var CAM_HEIGHT = 30;
    var CAM_BACK = 35;
    var FOV = 0.8;
    var CAM_LEN = Math.sqrt(CAM_HEIGHT * CAM_HEIGHT + CAM_BACK * CAM_BACK);
    var FWD_Y = -CAM_HEIGHT / CAM_LEN;
    var FWD_Z = CAM_BACK / CAM_LEN;
    var UP_Y = CAM_BACK / CAM_LEN;
    var UP_Z = CAM_HEIGHT / CAM_LEN;
    var TAN_HALF = Math.tan(FOV / 2);

    /*
     * The strip of ground this camera holds: z from -20 to 59 fills the frame exactly, so the grid
     * runs a little past both edges. One terrain node is one unit, so a six-unit cell is six of
     * them - fine enough that the ground reads as ground rather than as a chessboard, coarse enough
     * that a phone fills it in a couple of hundred quads.
     */
    var Z_NEAR = -26;
    var Z_FAR = 66;
    var CELL = 6;

    /*
     * Points are written into slots that live as long as the animation, not returned fresh.
     *
     * The version before this one returned a new {x, y} for every corner, which is four objects
     * per ground cell and six per building - around four hundred a frame, thirty times a second.
     * On a phone that is a garbage collection every few seconds, and a collection is exactly the
     * kind of pause that shows up in bootMaxGap. Measured over the first half of the experiment,
     * a quarter of the sessions that left had seen a stall of more than a second, against one in
     * fifty of the sessions that stayed.
     *
     * Six slots, because drawObjects needs six corners of one box at the same time. Everything
     * else uses the first four.
     */
    var P = [
      {x: 0, y: 0}, {x: 0, y: 0}, {x: 0, y: 0},
      {x: 0, y: 0}, {x: 0, y: 0}, {x: 0, y: 0}
    ];

    /**
     * A point on the ground, or above it, where the game's camera would put it. Writes into the
     * given slot and says whether it landed in front of the camera.
     */
    function project(x, z, y, out) {
      var vy = (y || 0) - CAM_HEIGHT;
      var vz = z + CAM_BACK;
      var zc = vy * FWD_Y + vz * FWD_Z;
      if (zc < 0.5) {
        // Behind the camera, or so close to its plane that the projection blows up.
        return false;
      }
      var yc = vy * UP_Y + vz * UP_Z;
      var aspect = width / height;
      out.x = width * 0.5 * (1 + (x / zc) / (TAN_HALF * aspect));
      out.y = height * 0.5 * (1 - (yc / zc) / TAN_HALF);
      return true;
    }

    /** How far to either side the frame reaches at this depth, in world units. */
    function halfWidthAt(z) {
      var zc = (-CAM_HEIGHT) * FWD_Y + (z + CAM_BACK) * FWD_Z;
      return TAN_HALF * (width / height) * zc + CELL;
    }

    /** Where the build has got to. It runs from the far edge towards the camera. */
    function frontAt(progress) {
      return Z_FAR - (Z_FAR - Z_NEAR) * Math.min(1, progress);
    }

    /**
     * How far to either side the columns run at this depth, snapped to the grid. Narrow up close,
     * wide far away. A single number rather than a {from, to} pair, because the range is symmetric
     * and the pair was one more object per row per frame.
     */
    function columnHalf(z) {
      return Math.ceil(halfWidthAt(z) / CELL) * CELL;
    }

    function drawCells(wash) {
      var edge = frontAt(wash);
      for (var z = Z_FAR - CELL; z >= Z_NEAR; z -= CELL) {
        if (z + CELL < edge) {
          continue;
        }
        var half = columnHalf(z + CELL);
        // Fades in over one cell's depth, so the colour arrives as a soft front rather than a step.
        var alpha = Math.min(1, (z + CELL - edge) / CELL);
        /*
         * The two colours of this row, built once instead of once per cell. The alpha only depends
         * on the row, so the string was the same across the whole row and was being rebuilt - and
         * reparsed as a CSS colour by the canvas - for every quad in it. lastSand then keeps the
         * assignment itself down to one per run of same-material cells, which patches two wide
         * make roughly half of them.
         */
        var rowAlpha = (alpha * 0.6).toFixed(3);
        var sandStyle = 'rgba(96, 92, 68,' + rowAlpha + ')';
        var grassStyle = 'rgba(60, 82, 62,' + rowAlpha + ')';
        var lastSand = -1;
        var a = P[0], b = P[1], c = P[2], d = P[3];
        for (var x = -half; x < half; x += CELL) {
          if (!project(x, z + CELL, 0, a) || !project(x + CELL, z + CELL, 0, b)
            || !project(x + CELL, z, 0, c) || !project(x, z, 0, d)) {
            continue;
          }
          /*
           * Grass and sand in patches, not per cell. Two cells to a patch, because the ground in
           * the game is areas of one and areas of the other - cell-by-cell noise reads as static.
           * The multiplications go through imul: without it the products leave the 32 bit range,
           * the low bits stop mixing and the pattern comes out in stripes.
           */
          var px = Math.floor(x / (CELL * 2)) + 512;
          var pz = Math.floor(z / (CELL * 2)) + 512;
          var mix = Math.imul(px, 374761393) ^ Math.imul(pz, 668265263);
          mix = Math.imul(mix ^ (mix >>> 13), 1274126177);
          var sand = ((mix ^ (mix >>> 16)) >>> 0) % 100 < 42 ? 1 : 0;
          if (sand !== lastSand) {
            ctx.fillStyle = sand ? sandStyle : grassStyle;
            lastSand = sand;
          }
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.lineTo(d.x, d.y);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    function drawWireframe(progress) {
      var edge = frontAt(progress);
      var farHalf = columnHalf(Z_FAR);
      var left = P[0], right = P[1];
      ctx.lineWidth = 1;
      // Lines across, one per row of cells, appearing as the front passes them.
      for (var z = Z_FAR; z >= Z_NEAR; z -= CELL) {
        if (z < edge) {
          continue;
        }
        var age = (z - edge) / CELL;
        var settled = Math.min(1, age);
        var glow = Math.max(0, 1 - age);
        var rowHalf = columnHalf(z);
        if (!project(-rowHalf, z, 0, left) || !project(rowHalf, z, 0, right)) {
          continue;
        }
        ctx.lineWidth = glow > 0.2 ? 1.6 : 1;
        ctx.strokeStyle = 'rgba(' + (glow > 0.2 ? CYAN : GREEN) + ','
          + (0.18 + settled * 0.16 + glow * 0.5).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(left.x, left.y);
        ctx.lineTo(right.x, right.y);
        ctx.stroke();
      }
      // Lines into the distance, growing with the front rather than appearing whole.
      var near = Math.max(Z_NEAR, edge);
      if (near >= Z_FAR) {
        return;
      }
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(' + GREEN + ', 0.2)';
      /*
       * All of these share one colour and one width, so they are one path with a subpath each and
       * a single stroke at the end - rather than a beginPath and a stroke per line. Every stroke
       * is a rasterisation pass of its own; ten of them a frame is nine more than this needs.
       * Separate subpaths never join, so the picture is the same.
       */
      var far = P[2], end = P[3];
      ctx.beginPath();
      for (var x = -farHalf; x <= farHalf; x += CELL) {
        if (!project(x, Z_FAR, 0, far) || !project(x, near, 0, end)) {
          continue;
        }
        ctx.moveTo(far.x, far.y);
        ctx.lineTo(end.x, end.y);
      }
      ctx.stroke();
    }

    function drawObjects(progress) {
      for (var i = 0; i < objects.length; i++) {
        var obj = objects[i];
        var since = (progress - obj.at) / 0.12;
        if (since <= 0) {
          continue;
        }
        var grown = Math.min(1, since);
        var height3d = obj.tall * grown;
        var x0 = obj.x;
        var x1 = obj.x + obj.size;
        var zNear = obj.z;
        var zFar = obj.z + obj.size;
        var baseLeft = P[0], baseRight = P[1], topLeft = P[2],
          topRight = P[3], backLeft = P[4], backRight = P[5];
        if (!project(x0, zNear, 0, baseLeft) || !project(x1, zNear, 0, baseRight)
          || !project(x0, zNear, height3d, topLeft) || !project(x1, zNear, height3d, topRight)
          || !project(x0, zFar, height3d, backLeft) || !project(x1, zFar, height3d, backRight)) {
          continue;
        }
        // Colour arrives after the outline, the way the materials do in the real start.
        var solid = Math.max(0, Math.min(1, since - 1.2));
        if (solid > 0) {
          // The same number in both faces, formatted once.
          var solidAlpha = (solid * 0.94).toFixed(3);
          ctx.fillStyle = 'rgba(38, 48, 62,' + solidAlpha + ')';
          ctx.beginPath();
          ctx.moveTo(baseLeft.x, baseLeft.y);
          ctx.lineTo(baseRight.x, baseRight.y);
          ctx.lineTo(topRight.x, topRight.y);
          ctx.lineTo(topLeft.x, topLeft.y);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = 'rgba(74, 92, 112,' + solidAlpha + ')';
          ctx.beginPath();
          ctx.moveTo(topLeft.x, topLeft.y);
          ctx.lineTo(topRight.x, topRight.y);
          ctx.lineTo(backRight.x, backRight.y);
          ctx.lineTo(backLeft.x, backLeft.y);
          ctx.closePath();
          ctx.fill();
        }
        ctx.lineWidth = 1.3;
        ctx.strokeStyle = 'rgba(' + CYAN + ',' + (0.4 + (1 - grown) * 0.5).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(baseLeft.x, baseLeft.y);
        ctx.lineTo(baseRight.x, baseRight.y);
        ctx.lineTo(topRight.x, topRight.y);
        ctx.lineTo(topLeft.x, topLeft.y);
        ctx.closePath();
        ctx.stroke();
      }
    }

    function draw(now, progress) {
      ctx.clearRect(0, 0, width, height);

      // Colour last: the wireframe is drawn, then it gets its ground.
      var wash = Math.max(0, (progress - 0.5) / 0.5);
      if (wash > 0) {
        // Cells first, so the wireframe stays on top of its own material.
        drawCells(wash);
      }
      drawWireframe(Math.min(1, progress / 0.5));
      drawObjects(progress);

      // The one thing that moves on its own. Without it a download that stalls looks like a page
      // that crashed, which is the reading this whole screen exists to avoid.
      if (!reduced) {
        // Runs in the world, not down the screen, so it keeps the plane's perspective.
        var sweepZ = Z_FAR - (Z_FAR - Z_NEAR) * ((now % 2600) / 2600);
        var lead = P[0], trail = P[1];
        if (project(0, sweepZ, 0, lead) && project(0, sweepZ + CELL * 1.5, 0, trail)
          && trail.y < lead.y) {
          var band = ctx.createLinearGradient(0, trail.y, 0, lead.y);
          band.addColorStop(0, 'rgba(' + CYAN + ', 0)');
          band.addColorStop(1, 'rgba(' + CYAN + ', 0.22)');
          ctx.fillStyle = band;
          ctx.fillRect(0, trail.y, width, lead.y - trail.y);
        }
      }
    }

    /*
     * Thirty frames a second, not sixty. This shares a thread with the bundle the player is
     * waiting for, and the animation must never be the reason it arrives later.
     */
    var shown = 0;
    var last = 0;
    /*
     * When the download was last measured. See the throttle in frame().
     *
     * Far enough in the past that the first frame always measures: starting at zero would have
     * held the first reading back by a quarter of a second, and the build would have begun from
     * nothing on a warm start where the bundle was already there.
     */
    var counted = -1e9;
    /*
     * Whether any of this was on screen at all.
     *
     * requestAnimationFrame does not run while the main thread is busy, and during a cold start
     * that thread is compiling 2.7 MB of JavaScript in the gaps between chunks arriving. An
     * animation that gets three frames in five seconds is a still picture with extra steps, and
     * from the outside it is indistinguishable from the plain splash - which is exactly the
     * report that came back from a phone. Counted here, sent with STARTUP_TIMING, so the question
     * has an answer instead of a guess.
     */
    window.RAZ_bootFrames = 0;
    window.RAZ_bootMaxGap = 0;

    function frame(now) {
      if (!document.getElementById('raz-boot')) {
        return;
      }
      if (last) {
        window.RAZ_bootMaxGap = Math.max(window.RAZ_bootMaxGap, Math.round(now - last));
      }
      if (now - last >= 33) {
        last = now;
        window.RAZ_bootFrames++;
        if (demoMillis) {
          // ?bootDemo - the build paced by a clock instead of by the download, because on a
          // developer machine the whole bundle is here in half a second and there is nothing to
          // watch. The number of seconds is the parameter's value, twelve by default.
          demoProgress = Math.min(1, (now - started) / demoMillis);
        } else if (now - counted >= 250) {
          /*
           * Four times a second, not thirty. recount walks performance.getEntriesByType, which
           * hands back a fresh array of wrapper objects over a buffer this page raises to 20000
           * entries - so the cost grows with every file the start has fetched, and it was being
           * paid on every frame. Chunks land hundreds of milliseconds apart; reading the total
           * more often than that only produced the same number again.
           *
           * The build-up does not step, because shown eases towards the target on every frame
           * either way - it is the easing that is drawn, not the measurement.
           */
          counted = now;
          recount();
        }
        // Eased towards the measurement rather than snapped to it, so one chunk landing does not
        // jump the build forward. Never retreats: a bar that goes backwards is worse than one
        // that stops.
        /*
         * Two halves, because two different things are being waited for and only one of them can
         * be seen from here. The JavaScript arriving fills the first half; the engine's own boot -
         * the worker, the configuration, the models - fills the second, and the application has to
         * report that because nothing in the page can measure it.
         */
        var target = demoMillis
          ? demoProgress
          : (enginePart < 0
            ? Math.min(0.5, bytes / EXPECTED_BYTES * 0.5)
            : 0.5 + enginePart * 0.5);
        shown = Math.max(shown, shown + (target - shown) * 0.08);
        try {
          draw(now, shown);
        } catch (ignored) {
          return;
        }
      }
      requestAnimationFrame(frame);
    }

    if (reduced) {
      // Someone who asked the system to stop animating gets one picture of a world already built.
      try {
        draw(0, 1);
      } catch (ignored) {
      }
    } else {
      requestAnimationFrame(function (now) {
        started = now;
        frame(now);
      });
    }

    /*
     * The handover. ScreenCoverComponent calls this instead of removing the splash outright, so
     * the built world dissolves into the real one rather than being cut away.
     *
     * Defined inside the grid arm on purpose, after the early return above: the other half of the
     * players must see exactly the screen this is being measured against, and there they get the
     * component's own remove. It cannot reach the number either way - what is being counted is
     * players leaving during the wait, and this runs once the wait is over.
     */
    /*
     * The engine's progress, handed in by ScreenCoverComponent. The sweeping stripe stops here:
     * it means "nobody can say how far along this is", and from this call on somebody can.
     */
    window.RAZ_bootProgress = function (fraction) {
      enginePart = Math.max(0, Math.min(1, fraction));
      var fill = document.getElementById('raz-boot-fill');
      if (fill) {
        fill.style.animation = 'none';
        fill.style.left = '0';
        fill.style.width = Math.round(5 + enginePart * 95) + '%';
      }
    };

    /*
     * The terrain is on screen. Until this, the loading screen stays up - the first engine tick
     * comes while the ground is still untextured, and handing over there shows an empty plane.
     */
    window.RAZ_bootTerrainReady = function () {
      window.RAZ_bootFadeOut();
    };

    window.RAZ_bootFadeOut = function () {
      var splash = document.getElementById('raz-boot');
      if (!splash) {
        return;
      }
      splash.classList.add('raz-boot-leaving');
      setTimeout(function () {
        if (splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 500);
    };
  })();
</script>
<app-root></app-root>
</body>
