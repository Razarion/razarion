<!doctype html>
<html lang="en" class="razarion-frontend-dark">
<head>
  <meta charset="utf-8">
  <title>Razarion – RTS meets MMO: One World That Never Stops</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta property="og:title" content="Razarion – RTS meets MMO: One World That Never Stops">
  <meta property="og:description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://razarion.com">
  <meta property="og:image" content="https://razarion.com/card.jpg">
  <meta property="og:site_name" content="Razarion">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@AloRtsDev">
  <meta name="twitter:title" content="Razarion – RTS meets MMO: One World That Never Stops">
  <meta name="twitter:description" content="RTS meets MMO: one shared world that never stops. Inspired by Command &amp; Conquer and StarCraft — persistent shared world, quests and levels. Play free in your browser via WebAssembly, no download. Open-source and community-driven.">
  <meta name="twitter:image" content="https://razarion.com/card.jpg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Startup tracking starts here, before anything else loads.
     *
     * The engine used to open the session, so a startup only became visible once the Angular
     * bundle and the WebAssembly module had been downloaded and run. Everyone who left before
     * that - by far the largest group of players who never reach the game - produced no record
     * at all and the tracking showed a clean startup list. This opens the session at page load
     * instead, and reports the player leaving while the startup is still running.
     *
     * The window globals below are shared with the client: see PageBootGlobals.java (which
     * documents them) and client-bootstrap.js. Tracking must never break the game, so every
     * step is wrapped and failures are swallowed.
     */
    (function () {
      // The admin backend is not a game startup.
      if (location.pathname.indexOf('/backend') >= 0) {
        return;
      }
      var w = window;
      w.RAZ_gameSessionUuid = 'PG' + Date.now().toString(36).toUpperCase()
        + Math.random().toString(36).slice(2, 10).toUpperCase();
      w.RAZ_currentTask = 'PAGE_LOADED';
      w.RAZ_startupTerminated = null;

      var params = new URLSearchParams(location.search);

      function payload(extra) {
        var body = {
          gameSessionUuid: w.RAZ_gameSessionUuid,
          rdtCid: params.get('rdt_cid'),
          twclid: params.get('twclid'),
          utmCampaign: params.get('utm_campaign'),
          utmSource: params.get('utm_source')
        };
        for (var key in extra) {
          body[key] = extra[key];
        }
        return body;
      }

      // sendBeacon survives the page going away, which a normal fetch does not. Shared with
      // client-bootstrap.js so both halves report the same way.
      w.RAZ_track = function (path, body) {
        try {
          var blob = new Blob([JSON.stringify(body)], {type: 'application/json'});
          if (!navigator.sendBeacon || !navigator.sendBeacon(path, blob)) {
            fetch(path, {method: 'POST', body: blob, keepalive: true}).catch(function () {
            });
          }
        } catch (ignored) {
        }
      };
      w.RAZ_trackPayload = payload;

      // "A browser got this far." Anything that never reports it left during the page load.
      w.RAZ_track('/rest/tracker/startupTask', payload({
        taskEnum: 'PAGE_LOADED',
        startTime: Date.now(),
        duration: 0,
        userAgent: navigator.userAgent,
        error: (typeof WebAssembly === 'undefined') ? 'No WebAssembly support' : null
      }));

      // The player left while the startup was still running. Reported once; a startup that
      // ended on its own sets RAZ_startupTerminated and is not an abort.
      var reported = false;

      function abort() {
        if (reported || w.RAZ_startupTerminated) {
          return;
        }
        reported = true;
        w.RAZ_track('/rest/tracker/startupTerminated', payload({
          successful: false,
          aborted: true,
          lastTaskEnum: w.RAZ_currentTask || 'PAGE_LOADED'
        }));
      }

      addEventListener('pagehide', abort);
      // Safari on iOS frequently kills a tab without ever firing pagehide; hidden is the only
      // signal that survives there. It also fires on a plain tab switch, so a player who comes
      // back and finishes still sends a real terminated record - the server drops the abort
      // when a session has both.
      addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          abort();
        }
      });
    })();
  </script>
</head>
<body style="height: 100%; width: 100%; position: absolute">
<!--
  Boot splash. Everything below renders on the first paint, before the Angular bundle has even
  been fetched - which is the whole point, so it has to stay inline. No external stylesheet, no
  webfont, no framework.

  Until this existed the body held nothing but <app-root>, so a player stared at an empty page
  for the seconds it takes to download and start Angular. In the tracking that is the largest
  single group of lost startups: sessions that report PAGE_LOADED and never reach WASM_BOOTSTRAP,
  half of them gone within eight seconds - on current Chrome, so not a compatibility problem.
  They left because nothing indicated that anything was happening.

  The bar is deliberately indeterminate: at this stage nobody can say how far along the download
  is, and a made-up number that crawls is worse than an honest "working on it". The real,
  measured bar takes over in ScreenCoverComponent, which also removes this splash.
-->
<div id="raz-boot">
  <div id="raz-boot-card">
    <div id="raz-boot-title">Razarion &ndash; RTS meets MMO: One shared world that never stops</div>
    <div id="raz-boot-box">
      <div id="raz-boot-label">Loading&hellip;</div>
      <div id="raz-boot-track">
        <div id="raz-boot-fill"></div>
      </div>
    </div>
    <ul id="raz-boot-tips">
      <li>Arrow keys or WASD to scroll the map</li>
      <li>Mouse to place and command units</li>
      <li>Mouse wheel to zoom in and out</li>
    </ul>
  </div>
</div>
<style>
  /* Mirrors screen-cover.component.scss so the handover to Angular is not a visible jump. */
  #raz-boot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    background: linear-gradient(180deg, rgba(10, 10, 18, 0.2) 0%, rgba(10, 10, 18, 0.5) 50%, rgba(10, 10, 18, 0.8) 100%), url("/razarion-bg.webp") center/cover no-repeat;
    font-family: Arial, Helvetica, sans-serif;
    color: #CCC;
  }

  #raz-boot-card {
    position: absolute;
    width: 40em;
    max-width: calc(100% - 2em);
    box-sizing: border-box;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: solid 1px #014737;
    padding: 10px;
    background-color: black;
    box-shadow: 0 0 10px 0 black;
  }

  #raz-boot-title {
    padding: 0.75rem 0.5rem 1rem;
  }

  #raz-boot-box {
    border: 1px solid #57534e;
    border-radius: 0.75rem;
    padding: 0.25rem;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }

  #raz-boot-label {
    padding-left: 0.5rem;
  }

  /* 28em/1.1em are the dimensions of the p-progressbar this hands over to. */
  #raz-boot-track {
    position: relative;
    width: 28em;
    max-width: 60%;
    height: 1.1em;
    overflow: hidden;
    background-color: #1c1917;
    border-radius: 0.25rem;
  }

  #raz-boot-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 35%;
    background-color: #10b981;
    animation: raz-boot-sweep 1.6s ease-in-out infinite;
  }

  @keyframes raz-boot-sweep {
    0% { left: -35%; }
    100% { left: 100%; }
  }

  /* A sweeping bar is motion for its own sake to anyone who asked the system to stop animating. */
  @media (prefers-reduced-motion: reduce) {
    #raz-boot-fill {
      animation: none;
      left: 0;
      width: 100%;
      opacity: 0.35;
    }
  }

  #raz-boot-tips {
    list-style: none;
    margin: 0;
    padding: 0.5rem;
  }

  #raz-boot-tips li {
    padding: 0.3rem 0;
  }
</style>
<script>
  /*
   * The splash belongs to the game only. The backend and the auth pages are ordinary Angular
   * views with no WebAssembly behind them, and covering them with a game loading screen would
   * be wrong. Kept in sync with the route table in app.routes.ts.
   */
  (function () {
    var path = location.pathname;
    if (path.indexOf('/backend') >= 0
      || path.indexOf('/invalid-token') >= 0
      || path.indexOf('/verify-email') >= 0) {
      var splash = document.getElementById('raz-boot');
      if (splash) {
        splash.parentNode.removeChild(splash);
      }
    }
  })();
</script>
<app-root></app-root>
</body>
</html>
