<div class="flex flex-col gap-1" style="width: 30em; max-width: 100%">
  <div class="chat-box bg-surface-800 p-2 rounded-xl border border-surface-500">
    <p-scrollpanel #scrollPanel [style]="{ width: '100%', height: '10em' }">
      <div class="flex flex-col gap-1" #chatMessageDiv>
        @for (chatMessage of chatMessages; track $index) {
          <div class="chat-message flex flex-col p-0 m-0" style="max-width: 28em">
            <p class="user-name" [class.assistant]="chatMessage.userName === 'Razarion AI'" [class.news]="chatMessage.userName === 'Razarion'">{{ chatMessage.userName }}<span class="time">{{ time(chatMessage.timestamp) }}</span></p>
            <div class="message">{{ chatMessage.message }}</div>
            @if (hasReel(chatMessage)) {
              <!-- Nothing of Instagram loads before this is tapped (openReel). -->
              <button type="button" class="instagram" (click)="openReel(chatMessage.instagramUrl!)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="dot" cx="17.5" cy="6.5" r="1"/></svg>
                Instagram
              </button>
            }
          </div>
        }
      </div>
    </p-scrollpanel>
  </div>
  <div class="chat-box flex bg-surface-800 p-2 rounded-xl border border-surface-500 items-center bg-surface-100 gap-1">
    <input pInputText [(ngModel)]="messageToSend" (keydown.enter)="onSend()" maxlength="300"
           placeholder="Message to all players" class="w-full"/>
    <p-button
      class="rounded"
      label="Send"
      size="small"
      [disabled]="sending || !messageToSend || messageToSend.trim().length === 0"
      (click)="onSend()">
    </p-button>
  </div>
  @if (sendError) {
    <div class="send-error px-2">{{ sendError }}</div>
  }
</div>

@if (openReelUrl !== null) {
  <!-- Over the game, scrollable on a phone. The X stays where it is while the card scrolls; a tap
       beside the card closes it as well. -->
  <div class="reel-overlay" (click)="closeReel()">
    <button type="button" class="reel-close" (click)="closeReel(); $event.stopPropagation()" aria-label="Close">&#10005;</button>
    <div class="reel-card" (click)="$event.stopPropagation()" #reelHost></div>
  </div>
}
