<div class="quest-panel flex flex-col gap-1">
  <div class="quest-box flex flex-col bg-surface-800 p-3 rounded-xl border border-surface-500"
    [ngStyle]="{color:'surface-300'}">
    <div class="quest-title font-semibold items-center">
      {{ title }}
    </div>
    @for (progressRow of progressRows; track progressRow) {
      <div class="quest-row flex flex-row">
        <div class="flex items-center justify-center p-1">
          @if (!progressRow.done) {
            <i class="pi pi-exclamation-triangle" style="color: yellow"></i>
          }
          @if (progressRow.done) {
            <i class="pi pi-check-circle" style="color: green"></i>
          }
        </div>
        <div class="flex">{{ progressRow.text }}</div>
      </div>
    }
    @if (timeRow) {
      <div class="quest-row flex flex-col">
        {{ timeRow }}
      </div>
    }
  </div>
  <div class="quest-box flex bg-surface-800 p-3 rounded-xl border border-surface-500 items-center gap-2 bg-surface-100">
    <!-- The switch used to stand there unlabelled, which is a riddle on a desktop and a smaller
         riddle on a phone. -->
    <label class="quest-switch flex items-center gap-2 grow">
      <p-toggleSwitch (onChange)="onShowQuestInGameVisualisation($event.checked)"
        [(ngModel)]="showQuestInGameVisualisation">
      </p-toggleSwitch>
      <span class="quest-switch-label">Show in game</span>
    </label>
    @if (showQuestSelectionButton) {
      <div class="flex-none">
        <p-button type="button" label="Quests" icon="pi pi-list" styleClass="p-button-sm"
          (onClick)="cockpitDisplayService.showQuestDialog = true">
        </p-button>
      </div>
    }
  </div>
</div>

<!-- 30vw is 124px on a phone - narrower than its own header. -->
<!-- On the body, not in the panel: in compact mode this panel is an overlay that scrolls
     (overflow:auto) and is hidden with visibility:hidden when closed - either would swallow a
     dialog rendered inside it. -->
<p-dialog header="Quests" appendTo="body" [(visible)]="cockpitDisplayService.showQuestDialog"
          [style]="{width: dialogWidth}">
  @if (cockpitDisplayService.showQuestDialog) {
    <quest-dialog></quest-dialog>
  }
</p-dialog>
