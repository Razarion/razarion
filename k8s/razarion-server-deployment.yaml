apiVersion: apps/v1
kind: Deployment
metadata:
  name: razarion-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: razarion-server
  template:
    metadata:
      labels:
        app: razarion-server
    spec:
      # Siehe razarion-server-priorityclass.yaml: ohne das ist der Pod mit Prioritaet 0
      # der bevorzugte Kandidat, wenn Autopilot einen Node aufraeumt und Platz braucht.
      priorityClassName: razarion-server-high
      containers:
        - name: razarion-server
          image: us-central1-docker.pkg.dev/neural-passkey-426618-j3/razarion-repo/razarion-server:latest
          ports:
            - containerPort: 8080
          # requests == limits (QoS class Guaranteed). Vorher stand hier request 1Gi
          # gegen limit 2Gi, waehrend der Container im Normalbetrieb ~1.85 GB braucht.
          # Autopilot dimensioniert und verrechnet den Node nach den *requests*, und
          # das Kubelet wirft bei Node-Memory-Pressure zuerst den Pod raus, der ueber
          # seinem request liegt - also immer diesen. Ergebnis waren Evictions alle
          # 15-24 h ("node was low on resource: memory ... using 1903392Ki, request is
          # 1Gi"), die jedes Mal saemtliche laufenden Spieler aus dem Spiel geworfen
          # haben. Ein Guaranteed-Pod ist kein Eviction-Kandidat mehr.
          #
          # 3Gi statt 2Gi, weil 1.85 GB Ist-Verbrauch nur ~150 MB unter dem alten Limit
          # lagen: der Pod waere sonst statt evicted einfach cgroup-OOM-gekillt worden.
          # MaxRAMPercentage unten ist passend auf 60 gesenkt, damit die JVM den neuen
          # Platz nicht sofort wieder ausfuellt (Xmx 1.8 GiB, erwarteter Peak ~2.2 GB,
          # also ~800 MB Reserve statt bisher ~150 MB).
          #
          # cpu ebenfalls request == limit. Autopilot verlangt beim Standard-Compute-
          # Class ein Verhaeltnis von hoechstens 6.5 GiB Memory pro vCPU *request* und
          # wuerde den CPU-request bei 3Gi/300m sonst selbst hochziehen; 1000m ergibt
          # 3:1 und bleibt damit dort, wo das Limit ohnehin schon stand.
          resources:
            requests:
              memory: "3Gi"
              cpu: "1000m"
            limits:
              memory: "3Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: keystore
              mountPath: "/etc/keystore"
              readOnly: true
          env:
            - name: JAVA_TOOL_OPTIONS
              # 60 % von 3Gi = 1.8 GiB Heap. Siehe Kommentar bei resources: bewusst
              # niedriger als die frueheren 75 %, damit die groessere Box als Reserve
              # ankommt und nicht als zusaetzlicher Heap.
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://mariadb-service:3306/razarion
            - name: SPRING_DATASOURCE_USERNAME
              value: raz_user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: user-password
            - name: GRAFANA_LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-secrets
                  key: grafana-loki-url
            - name: GRAFANA_LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-secrets
                  key: grafana-loki-username
            - name: GRAFANA_LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-secrets
                  key: grafana-loki-password
            - name: JWT_KEYSTORE_LOCATION
              value: /etc/keystore/jwt-keystore.p12
            - name: JWT_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: keystore-password
            - name: JWT_KEY_ALIAS
              value: jwt
            - name: JWT_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: key-password
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: uri
            - name: SPRING_MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: host
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: password
            - name: REDDIT_ADS_PIXEL_ID
              valueFrom:
                secretKeyRef:
                  name: reddit-ads-secrets
                  key: pixel-id
            - name: REDDIT_ADS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reddit-ads-secrets
                  key: access-token
            - name: X_ADS_PIXEL_ID
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: pixel-id
                  optional: true
            - name: X_ADS_PIXEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: pixel-token
                  optional: true
            - name: X_ADS_EVENT_PAGE_VISIT
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-page-visit
                  optional: true
            - name: X_ADS_EVENT_CLIENT_STARTUP
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-client-startup
                  optional: true
            - name: X_ADS_EVENT_BUILDER_DEPLOYED
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-builder-deployed
                  optional: true
            - name: X_ADS_EVENT_QUEST_PASSED
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-quest-passed
                  optional: true
            - name: X_ADS_EVENT_LEVEL_UP
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-level-up
                  optional: true
      volumes:
      - name: keystore
        secret:
          secretName: keystore-secret
          items:
            - key: jwt-keystore.p12
              path: jwt-keystore.p12