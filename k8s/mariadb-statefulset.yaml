# mariadb-statefulset.yaml (AKTUALISIERT)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: razarion-mariadb
spec:
  serviceName: "mariadb-service"
  replicas: 1
  selector:
    matchLabels:
      app: razarion-mariadb
  template:
    metadata:
      labels:
        app: razarion-mariadb
    spec:
      terminationGracePeriodSeconds: 10
      volumes:
        - name: mariadb-config
          configMap:
            name: mariadb-custom-config
      containers:
        - name: mariadb
          image: mariadb:10.5
          ports:
            - containerPort: 3306
          # mysqld lag mit ~447-518 MB RSS praktisch auf dem alten 512Mi-Limit und wurde
          # deshalb regelmaessig cgroup-OOM-gekillt (14 Restarts, im Node-Log als
          # "Memory cgroup out of memory: Killed process ... (mysqld) anon-rss:518024kB").
          # Jeder Kill reisst auch die Spieler aus dem Spiel. 1Gi gibt echten Puffer.
          #
          # cpu 250m statt 100m nicht wegen Bedarf (Ist-Verbrauch ~1m), sondern weil
          # Autopilot beim Standard-Compute-Class hoechstens 6.5 GiB Memory pro vCPU
          # request erlaubt - 1Gi/100m waeren 10:1 und wuerden von Autopilot selbst
          # hochgezogen. 250m ergibt 4:1 und ist zugleich das Autopilot-Minimum.
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "250m"
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: root-password
            - name: MARIADB_DATABASE
              value: razarion
            - name: MARIADB_USER
              value: raz_user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: user-password
          volumeMounts:
            - name: mariadb-persistent-storage
              mountPath: /var/lib/mysql
            - name: mariadb-config
              mountPath: /etc/mysql/conf.d/
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: mariadb-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "standard"
        resources:
          requests:
            storage: 5Gi