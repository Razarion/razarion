apiVersion: apps/v1
kind: Deployment
metadata:
  name: razarion-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: razarion-server
  template:
    metadata:
      labels:
        app: razarion-server
    spec:
      # Siehe razarion-server-priorityclass.yaml: ohne das ist der Pod mit Prioritaet 0
      # der bevorzugte Kandidat, wenn Autopilot einen Node aufraeumt und Platz braucht.
      priorityClassName: razarion-server-high
      containers:
        - name: razarion-server
          image: us-central1-docker.pkg.dev/neural-passkey-426618-j3/razarion-repo/razarion-server:__TAG__
          ports:
            - containerPort: 8080
          # requests == limits (QoS class Guaranteed). Vorher stand hier request 1Gi
          # gegen limit 2Gi, waehrend der Container im Normalbetrieb ~1.85 GB braucht.
          # Autopilot dimensioniert und verrechnet den Node nach den *requests*, und
          # das Kubelet wirft bei Node-Memory-Pressure zuerst den Pod raus, der ueber
          # seinem request liegt - also immer diesen. Ergebnis waren Evictions alle
          # 15-24 h ("node was low on resource: memory ... using 1903392Ki, request is
          # 1Gi"), die jedes Mal saemtliche laufenden Spieler aus dem Spiel geworfen
          # haben. Ein Guaranteed-Pod ist kein Eviction-Kandidat mehr.
          #
          # 3Gi statt 2Gi, weil 1.85 GB Ist-Verbrauch nur ~150 MB unter dem alten Limit
          # lagen: der Pod waere sonst statt evicted einfach cgroup-OOM-gekillt worden.
          # MaxRAMPercentage unten ist passend auf 60 gesenkt, damit die JVM den neuen
          # Platz nicht sofort wieder ausfuellt (Xmx 1.8 GiB, erwarteter Peak ~2.2 GB,
          # also ~800 MB Reserve statt bisher ~150 MB).
          #
          # cpu ebenfalls request == limit. Autopilot verlangt beim Standard-Compute-
          # Class ein Verhaeltnis von hoechstens 6.5 GiB Memory pro vCPU *request*; bei
          # 3Gi sind das mindestens 462m. Hier standen lange 1000m, einfach weil das
          # Limit ohnehin schon dort stand. Bezahlt wird bei Autopilot aber der
          # *request*, und der war damit der groesste einzelne Posten der Rechnung.
          #
          # 750m nach Messung ueber 14 Tage (kubernetes.io/container/cpu/core_usage_time,
          # 1-Minuten-Fenster): Median 0.059, p99 0.170, p99.9 0.702, Maximum 1.000 vCPU.
          # Die 45 Fenster ueber 0.5 vCPU liegen alle unmittelbar nach einem Container-
          # Start - die Uptime-Metrik faellt dort jeweils auf ~30 s. Das ist Spring-Boot-
          # Start, Planetenladen und JIT-Warmlauf, kein Spielbetrieb.
          #
          # Achtung bei 5-Minuten-Mittelwerten: die zeigen als Maximum 0.374 und legen
          # damit 500m nahe. Das ist ein Artefakt der Mittelung.
          #
          # Deshalb nicht 500m: der Spielbetrieb liefe damit bequem, der *Start* aber
          # gedrosselt - und ein doppelt so langer Boot laeuft gegen die livenessProbe
          # unten (120 s + 5 x 30 s), im schlechtesten Fall in eine Restart-Schleife.
          # 750m liegt ueber p99.9 und laesst den Start unangetastet.
          resources:
            requests:
              memory: "3Gi"
              cpu: "750m"
            limits:
              memory: "3Gi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: keystore
              mountPath: "/etc/keystore"
              readOnly: true
          env:
            - name: JAVA_TOOL_OPTIONS
              # 60 % von 3Gi = 1.8 GiB Heap. Siehe Kommentar bei resources: bewusst
              # niedriger als die frueheren 75 %, damit die groessere Box als Reserve
              # ankommt und nicht als zusaetzlicher Heap.
              #
              # -Xlog:gc* --- Diagnose fuer die langen Ticks. Am 20.09.2026 hing ein
              # einzelner Tick 89,5 s in notifyTickListeners(), und dort steht auf dem
              # Server ueberhaupt kein Code: der einzige Listener
              # (ServerGameEngineControl.onPostTick) ist auskommentiert. Der Thread hat
              # also nicht gearbeitet, sondern gestanden. Dass die ganze JVM stand und
              # nicht nur der Tick-Thread, liess sich nur indirekt zeigen -- die
              # Logdichte des Pods fiel in diesen 89 s von 42 auf 7,9 Zeilen/s, 94 % der
              # Wanduhr lagen in Luecken ueber einer Sekunde. Mit dieser Zeile steht die
              # Pause samt Ursache und Dauer direkt im Log, rueckwirkend und ohne dass
              # jemand den Moment treffen muss.
              #
              # Ein Thread-Dump waere hier das falsche Werkzeug (er zeigte den
              # Tick-Thread in einer leeren Methode), und er ginge auch nicht: das
              # Jib-Basisimage ist eclipse-temurin:21-jre, in /opt/java/openjdk/bin
              # liegen nur java, jfr, jrunscript, jwebserver, keytool, rmiregistry --
              # kein jcmd.
              #
              # -XX:StartFlightRecording --- die eigentliche Frage ist, WAS waechst: der
              # Speicher steigt nach jedem Neustart monoton (05:20 1224 MiB -> 16:20
              # 2428 MiB am 20.09.) und die langen Ticks erscheinen, sobald der Heap am
              # Anschlag ist. Da jcmd fehlt, kann die Aufzeichnung nicht auf Zuruf
              # ausgeloest werden, also laeuft sie von selbst: delay=90m, damit der Heap
              # schon gewachsen ist, 20 Minuten lang, dann schreibt die JVM die Datei
              # selbst. settings=profile enthaelt OldObjectSample -- die ueberlebenden
              # Objekte MIT Allokations-Stacktrace, also genau die Leckkandidaten.
              # Danach:
              #   kubectl cp <pod>:/tmp/leak.jfr leak.jfr -c razarion-server
              #   jfr summary leak.jfr
              #   jfr print --events OldObjectSample leak.jfr
              # Beides wieder entfernen, sobald die Ursache steht.
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Xlog:gc*:stdout:time,uptime,level,tags -XX:StartFlightRecording=name=leak,delay=90m,duration=20m,settings=profile,maxsize=64m,filename=/tmp/leak.jfr"
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://mariadb-service:3306/razarion
            - name: SPRING_DATASOURCE_USERNAME
              value: raz_user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: user-password
            - name: GRAFANA_LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-secrets
                  key: grafana-loki-url
            - name: GRAFANA_LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-secrets
                  key: grafana-loki-username
            - name: GRAFANA_LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-secrets
                  key: grafana-loki-password
            - name: JWT_KEYSTORE_LOCATION
              value: /etc/keystore/jwt-keystore.p12
            - name: JWT_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: keystore-password
            - name: JWT_KEY_ALIAS
              value: jwt
            - name: JWT_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: key-password
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: uri
            - name: SPRING_MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: host
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secrets
                  key: password
            - name: REDDIT_ADS_PIXEL_ID
              valueFrom:
                secretKeyRef:
                  name: reddit-ads-secrets
                  key: pixel-id
            - name: REDDIT_ADS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reddit-ads-secrets
                  key: access-token
            - name: X_ADS_PIXEL_ID
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: pixel-id
                  optional: true
            - name: X_ADS_PIXEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: pixel-token
                  optional: true
            - name: X_ADS_EVENT_PAGE_VISIT
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-page-visit
                  optional: true
            - name: X_ADS_EVENT_CLIENT_STARTUP
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-client-startup
                  optional: true
            - name: X_ADS_EVENT_BUILDER_DEPLOYED
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-builder-deployed
                  optional: true
            - name: X_ADS_EVENT_QUEST_PASSED
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-quest-passed
                  optional: true
            - name: X_ADS_EVENT_LEVEL_UP
              valueFrom:
                secretKeyRef:
                  name: x-ads-secrets
                  key: event-level-up
                  optional: true
            - name: META_ADS_PIXEL_ID
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: pixel-id
                  optional: true
            - name: META_ADS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: access-token
                  optional: true
            - name: META_ADS_TEST_EVENT_CODE
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: test-event-code
                  optional: true
            - name: META_ADS_EVENT_PAGE_VISIT
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: event-page-visit
                  optional: true
            - name: META_ADS_EVENT_CLIENT_STARTUP
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: event-client-startup
                  optional: true
            - name: META_ADS_EVENT_BUILDER_DEPLOYED
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: event-builder-deployed
                  optional: true
            - name: META_ADS_EVENT_QUEST_PASSED
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: event-quest-passed
                  optional: true
            - name: META_ADS_EVENT_LEVEL_UP
              valueFrom:
                secretKeyRef:
                  name: meta-ads-secrets
                  key: event-level-up
                  optional: true
            # Director mode, both halves. The first is the camera: fly a plan, record, list the
            # bases, and leave the world exactly as it was found.
            - name: RAZARION_DIRECTOR_ENABLED
              value: "true"
            # The second creates a base and spawns units that attack a bot, because the live world
            # does not stage a battle worth filming by itself: what happens here is a handful of
            # units against a bot building, over in seconds and reported only once somebody is
            # already dead.
            #
            # It used to be off here, on the grounds that staging destroys what players built. That
            # is still true of a battle aimed at a player, which is why the server now refuses one:
            # a staged attack may only target a bot, and both the spawn point and the target must
            # keep razarion.director.staging.min-human-distance from every other human base. Those
            # two rules are in application.properties and read no environment variable, so this
            # switch cannot quietly turn them off - see DirectorStagingController.
            #
            # What it leaves behind is the operator's own base, which POST /rest/director/clear-
            # staging removes when the take is in. Both halves need an ADMIN token either way.
            - name: RAZARION_DIRECTOR_STAGING_ENABLED
              value: "true"
      volumes:
      - name: keystore
        secret:
          secretName: keystore-secret
          items:
            - key: jwt-keystore.p12
              path: jwt-keystore.p12